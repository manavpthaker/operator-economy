<!DOCTYPE html>
<!--
  marker-checklist-card: HyperFrames motion primitive (scene)

  A hand-lettered paper card, measured from reference ad footage: a marker
  headline with an underline and a drawn ellipse around one word, then three
  checklist rows - typewriter label, marker value, a check that draws itself
  on. The aesthetic sibling of mk-specs-list's clean professional rows: this
  one is paper, marker and Courier.

  #root only, container-type: size, one paused timeline registered under the
  literal "marker-checklist-card" key. Ships two open-licensed faces (Permanent Marker, Apache-2.0; Courier Prime, OFL 1.1). Deterministic.
-->
<html lang="en" data-composition-id="marker-checklist-card" data-composition-duration="4.5" data-composition-variables="[{&quot;id&quot;: &quot;top&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Headline top&quot;, &quot;description&quot;: &quot;First marker line.&quot;, &quot;default&quot;: &quot;THE POWER&quot;}, {&quot;id&quot;: &quot;mid&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Headline middle&quot;, &quot;description&quot;: &quot;Small connecting word under the underline.&quot;, &quot;default&quot;: &quot;OF&quot;}, {&quot;id&quot;: &quot;circled&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Circled word&quot;, &quot;description&quot;: &quot;The word the marker ellipse draws around.&quot;, &quot;default&quot;: &quot;ONE&quot;}, {&quot;id&quot;: &quot;rest&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Headline rest&quot;, &quot;description&quot;: &quot;The rest of the bottom line.&quot;, &quot;default&quot;: &quot;FILE&quot;}, {&quot;id&quot;: &quot;l1&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Row 1 label&quot;, &quot;description&quot;: &quot;Typewriter label of row 1.&quot;, &quot;default&quot;: &quot;WRITE&quot;}, {&quot;id&quot;: &quot;v1&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Row 1 value&quot;, &quot;description&quot;: &quot;Marker value of row 1.&quot;, &quot;default&quot;: &quot;HTML&quot;}, {&quot;id&quot;: &quot;l2&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Row 2 label&quot;, &quot;description&quot;: &quot;Typewriter label of row 2.&quot;, &quot;default&quot;: &quot;RENDER&quot;}, {&quot;id&quot;: &quot;           <div data-hf-id="hf-r30l" class="mcc-mk" id="mcc-line2" data-layout-allow-overflow="" data-layout-allow-overlap="" data-layout-allow-occlusion="">

          <div data-hf-id="hf-vl3w" class="mcc-row" style="top: 62cqh" id="mcc-row1">

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var compositionId = "marker-checklist-card";
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function text(v, fb, mx) {
              if (typeof v !== "string") return fb;
              var t = v.trim();
              if (!t) return fb;
              return t.length > mx ? t.slice(0, mx) : t;
            }
            document.getElementById("mcc-top").textContent = text(vars.top, "THE POWER", 12);
            document.getElementById("mcc-mid").textContent = text(vars.mid, "OF", 6);
            document.getElementById("mcc-circled").textContent = text(vars.circled, "ONE", 8);

              ["2", "RENDER", "IN 4K"],
              ["3", "SHIP", "TODAY"],
            ].forEach(function (row) {
              var el = document.getElementById("mcc-row" + row[0]);
              el.querySelector(".mcc-label").textContent = text(vars["l" + row[0]], row[1], 9);
              el.querySelector(".mcc-value").textContent = text(vars["v" + row[0]], row[2], 9);
            });

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(
              "#mcc-card",
              { autoAlpha: 0, y: "2cqh" },
              { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" },
              0.2,
            );
            tl.fromTo(
              "#mcc-top",
              { autoAlpha: 0 },
              { autoAlpha: 1, duration: 0.25, ease: "none" },
              0.55,
            );
            tl.fromTo(
              ["#mcc-ul", "#mcc-mid"],
              { autoAlpha: 0 },
              { autoAlpha: 1, duration: 0.25, ease: "none" },
              0.8,
            );
            tl.fromTo(
              "#mcc-line2",
              { autoAlpha: 0 },
              { autoAlpha: 1, duration: 0.25, ease: "none" },
              1.05,
            );
            /* the marker draws the ellipse around the circled word */
            tl.set("#mcc-ellipse", { autoAlpha: 1 }, 1.3);
            tl.fromTo(
              "#mcc-ellipse ellipse",
              { strokeDasharray: 100, strokeDashoffset: 100 },
              { strokeDashoffset: 0, duration: 0.55, ease: "power1.inOut" },
              1.3,
            );
            gsap.set("#mcc-ellipse", { autoAlpha: 0 });
            /* rows land, each check draws itself on */
            [1, 2, 3].forEach(function (n, i) {
              var at = 1.9 + i * 0.55;
              tl.fromTo(
                "#mcc-row" + n,
                { autoAlpha: 0 },
                { autoAlpha: 1, duration: 0.25, ease: "none" },
                at,
              );
              tl.fromTo(
                "#mcc-row" + n + " .mcc-check path",
                { strokeDasharray: 100, strokeDashoffset: 100 },
                { strokeDashoffset: 0, duration: 0.35, ease: "power1.in" },
                at + 0.25,
              );
            });
            tl.set({}, {}, 4.5);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = tl;
          })();
