<script>
const t=gsap.timeline({paused:true});
// Master 205.083333 + cue. Frame 0 (cut from P03): inn, site and the stay timeline, no line into the space after checkout.
const C={"nobody":0.357,"not":2.637,"paid":4.617,"hand":7.377,"short":9.957,"last":11.757,"introduction2":16.757,"gap":19.917,"job2":20.497};
const fade=(sel,at,d=10/24)=>t.fromTo(sel,{autoAlpha:0},{autoAlpha:1,duration:d,ease:'power1.out'},at);

// "Nobody at the inn is." nothing new appears.
// "And that's not a lapse.": the desk is busy on the stay.
fade('#keeper',C.not);fade('#w1',C.not+.3);
// "The site is paid per introduction": its pay line reaches the booking only.
draw('#pay',C.paid,.6);
// "so it has no reason to hand over the relationship": the relationship stays at the site.
fade('#guest',C.hand-.3);draw('#rel',C.hand+.1,.4);
// "The desk is short staffed"
fade('#w2',C.short);
// "so writing to last year's guests is the job that never gets done": an empty place nothing reaches.
