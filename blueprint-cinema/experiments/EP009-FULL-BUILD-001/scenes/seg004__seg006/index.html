<script>
const t=gsap.timeline({paused:true});
// Master 16.833333 + cue. Word onsets from word-transcript.json.
// seg004 0-5.917 (frames 0-142), seg005 5.917-15.208 (142-365), seg006 15.208-19.5 (365-468).
const C={"string":0.667,"guest":2.727,"A":4.907,"cut005":5.917,"A2":6.507,"checkout":7.367,"stops":8.647,"year":10.167,"same":11.287,"same2":12.607,"cut006":15.208,"she":15.847,"same3":17.367};

const draw=(sel,at,d,ease='power1.inOut')=>{const p=document.querySelector(sel);const L=p.getTotalLength();t.set(sel,{autoAlpha:1,strokeDasharray:L,strokeDashoffset:L},at);t.to(sel,{strokeDashoffset:0,duration:d,ease},at)};

const typeOn=(id,at,dur)=>{const ts=document.getElementById(id);const s=ts.textContent;ts.textContent='';

  chars.forEach((c,i)=>t.set(c,{attr:{visibility:'visible'}},at+dur*i/chars.length));};

gsap.set('#relay',{x:178+150*1.55,y:109+232*1.55,scale:1.55*.98,svgOrigin:'0 0'});
