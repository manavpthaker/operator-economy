<script>const t=gsap.timeline({paused:true});
// Master 205.083333 + cue. Frame 0 (cut from P03): site and the stay timeline, no line into the space after checkout.
const C={"nobody":0.357,"not":2.637,"paid":4.617,"hand":7.377,"short":9.957,"last":11.757,"introduction2":16.757,"gap":19.917,"job2":20.497};
const fade=(sel,at,d=10/24)=>t.fromTo(sel,{autoAlpha:0},{autoAlpha:1,duration:d,ease:'power1.out'},at);
const draw=(sel,at,d)=>{const p=document.querySelector(sel);const L=p.getTotalLength();t.set(sel,{autoAlpha:1,strokeDasharray:L,strokeDashoffset:L},at);t.to(sel,{strokeDashoffset:0,duration:d,ease:'power1.inOut'},at)};
// "Nobody at the inn is." nothing new appears.
// "And that's not a lapse.": the desk is busy on the stay.
fade('#keeper',C.not-.5);
['#sh1','#sh2','#sh3'].forEach((q,i)=>t.fromTo(q,{autoAlpha:0,x:-70},{autoAlpha:1,x:0,duration:.45,ease:'power2.out'},C.not+i*.3));
// "The site is paid per introduction": its pay line reaches the booking only.
draw('#pay',C.paid,.6);t.fromTo('#paytag',{autoAlpha:0,y:-6},{autoAlpha:1,y:0,duration:8/24,ease:'power2.out'},C.paid+.55);
// "so it has no reason to hand over the relationship": the relationship stays at the site.
fade('#guest',C.hand-.3);draw('#rel',C.hand+.1,.4);
// "so writing to last year's guests is the job that never gets done": an empty place nothing reaches.
fade('#place',C.last,.5);fade('#place-l',C.last+.4);
// "paying an introduction fee to meet its own regulars": the second commission tag lands on the next booking.
t.fromTo('#tag',{autoAlpha:0,x:830,y:176},{autoAlpha:1,duration:.25,ease:'power1.out'},C.introduction2-.3);
t.to('#tag',{x:955,y:352,duration:.9,ease:'power2.inOut'},C.introduction2-.1);
// "That gap is a job."
t.fromTo('#ajob',{autoAlpha:0,y:6},{autoAlpha:1,y:0,duration:10/24,ease:'power2.out'},C.job2);
window.__timelines['ep009-seg020']=t;</script></body></html>
