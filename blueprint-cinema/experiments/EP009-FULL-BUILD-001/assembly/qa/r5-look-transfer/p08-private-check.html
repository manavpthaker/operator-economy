<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="same-origin">
<title>EP009 · Private review</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111713;color:#f1efdf}
*{box-sizing:border-box}[hidden]{display:none!important}
body{max-width:1120px;margin:0 auto;padding:28px;padding-bottom:max(28px,env(safe-area-inset-bottom))}
h1{font-size:24px;line-height:1.25;margin:0 0 8px;font-weight:650}
p{margin:8px 0 20px}.status,.caption{color:#b7c0b6;font-size:14px}
video{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:auto 16/9;background:#000;border-radius:5px;object-fit:contain}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 28px}
button{font:inherit;font-size:14px;line-height:1.3;min-height:44px;max-width:100%;padding:10px 14px;background:#25372c;color:#f1efdf;border:1px solid #56735f;border-radius:5px;cursor:pointer;touch-action:manipulation}
button:hover{background:#36533f}button:focus-visible{outline:3px solid #dbb06b;outline-offset:3px}
button:disabled{opacity:.45;cursor:default}.empty{color:#b7c0b6;padding:24px 0}
.comparisons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:24px}
figure{min-width:0;margin:0}figcaption{margin:8px 0 0}
@media(max-width:600px){body{padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}h1{font-size:22px}nav{gap:8px}button{flex:1 1 145px;text-align:left}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<h1 id="title">EP009 · Direct booking recovery</h1>
<p class="status" id="status">Private review · next version in preparation</p>
<p class="empty" id="empty" role="status">The next review will appear here when it is ready.</p>
<section id="full-film" aria-label="Full episode" hidden></section>
<nav id="playback-controls" aria-label="Playback controls" hidden><button id="play-pause" type="button">Play episode</button></nav>
<nav id="presenter-jumps" aria-label="Jump to a presenter appearance" hidden></nav>
<section class="comparisons" id="comparisons" aria-label="Presenter comparisons" hidden></section>
<noscript><p class="empty">Enable JavaScript to view the configured review videos.</p></noscript>
</main>
<!-- Configure only media that exists in this private review directory. No URL is requested while null/omitted. -->
<script id="review-config" type="application/json">{"title": "EP009 \u00b7 Corrected experience passage", "status": "Private review candidate \u00b7 original corrected narration", "fullFilm": {"src": "p08-private-check.mp4"}, "fps": 24, "comparisons": [], "presenterJumps": [{"label": "Start", "frame": 0}, {"label": "Second thought", "frame": 173}]}</script>
<script>
'use strict';
const config=JSON.parse(document.getElementById('review-config').textContent);
const title=document.getElementById('title');
const status=document.getElementById('status');
title.textContent=config.title||'EP009 · Direct booking recovery';
status.textContent=config.status||'Private review candidate';
document.title=title.textContent+' · Private review';
const empty=document.getElementById('empty');
let visiblePlayers=0;
function relativeMedia(entry){
  if(!entry||typeof entry.src!=='string'||!entry.src.trim())return null;
  const src=entry.src.trim();
  if(src.startsWith('//')||/^[a-z][a-z0-9+.-]*:/i.test(src))return null;
  const url=new URL(src,location.href);
  if(url.origin!==location.origin)return null;
  return src;
}
function updateEmpty(){empty.hidden=visiblePlayers>0;}
function addPlayer(entry,container,label,onReady,onError){
  const src=relativeMedia(entry);if(!src)return null;
  const video=document.createElement('video');
  video.controls=true;video.preload='metadata';video.playsInline=true;
  video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');
  video.setAttribute('aria-label',label);
  video.addEventListener('loadedmetadata',()=>{if(onReady)onReady(video);});
  video.addEventListener('play',()=>{document.querySelectorAll('video').forEach(other=>{if(other!==video)other.pause();});});
  video.addEventListener('error',()=>{
    video.remove();visiblePlayers--;container.hidden=true;
    if(onError)onError();updateEmpty();
    if(visiblePlayers===0)empty.textContent='The review video is not available yet.';
  },{once:true});
  container.append(video);container.hidden=false;visiblePlayers++;updateEmpty();
  video.src=src;
  return video;
}
const filmSection=document.getElementById('full-film');
const jumps=document.getElementById('presenter-jumps');
const fps=Number(config.fps)||24;
let film=addPlayer(config.fullFilm,filmSection,'Full episode review',video=>{
  document.getElementById('playback-controls').hidden=false;
  const playback=document.getElementById('play-pause');
  playback.addEventListener('click',()=>{if(video.paused)video.play().catch(()=>{});else video.pause();});
  video.addEventListener('play',()=>{playback.textContent='Pause episode';});
  video.addEventListener('pause',()=>{playback.textContent='Play episode';});
  const entries=Array.isArray(config.presenterJumps)?config.presenterJumps:[];
  jumps.replaceChildren();
  entries.forEach(entry=>{
    const frame=Number(entry.frame);const seconds=frame/fps;
    if(!Number.isInteger(frame)||frame<0||!Number.isFinite(seconds)||seconds>=video.duration)return;
    const button=document.createElement('button');button.type='button';
    const minute=Math.floor(seconds/60);const second=String(Math.floor(seconds%60)).padStart(2,'0');
    button.textContent=String(entry.label||'Presenter')+' · '+minute+':'+second;
    button.addEventListener('click',()=>{
      video.currentTime=seconds;video.play().catch(()=>{});
      video.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    });
    jumps.append(button);
  });
  jumps.hidden=jumps.childElementCount===0;
},()=>{jumps.hidden=true;jumps.replaceChildren();document.getElementById('playback-controls').hidden=true;});
const comparisons=document.getElementById('comparisons');
(Array.isArray(config.comparisons)?config.comparisons:[]).forEach(entry=>{
  if(!relativeMedia(entry))return;
  const figure=document.createElement('figure');const caption=document.createElement('figcaption');
  caption.className='caption';caption.textContent=entry.label||'Presenter comparison';
  comparisons.append(figure);
  const video=addPlayer(entry,figure,caption.textContent,null,()=>{
    figure.remove();comparisons.hidden=comparisons.childElementCount===0;
  });
  if(video){figure.append(caption);comparisons.hidden=false;}
});
</script>
</body>
</html>
