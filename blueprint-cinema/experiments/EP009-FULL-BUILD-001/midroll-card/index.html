<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>EP009 mid-roll Canvas card</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"BL Supreme"; src:url("assets/fonts/supreme-500.woff2") format("woff2");
        font-weight:500; font-display:block; }
      @font-face { font-family:"BL Supreme"; src:url("assets/fonts/supreme-400.woff2") format("woff2");
        font-weight:400; font-display:block; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; background:transparent; }
      .clip { position:absolute; inset:0; }
      /* A lower third on the Boundary Ledger paper, not a full-frame takeover: the
         episode keeps playing behind it and this is a soft mention, not a stop. */
      .card { position:absolute; left:96px; bottom:96px; background:#173530;
        padding:30px 44px 32px; max-width:980px;
        box-shadow:0 10px 34px rgba(0,0,0,0.30); }
      .rule { position:absolute; left:0; top:0; bottom:0; width:6px; background:#B5482F; }
      .kicker { font-family:"BL Supreme",system-ui,sans-serif; font-weight:500; font-size:23px;
        letter-spacing:0.22em; text-transform:uppercase; color:rgba(245,240,230,0.62); }
      .what { font-family:"BL Supreme",system-ui,sans-serif; font-weight:500; font-size:40px;
        line-height:1.28; color:#F5F0E6; margin-top:14px; }
      .where { font-family:"BL Supreme",system-ui,sans-serif; font-weight:400; font-size:26px;
        letter-spacing:0.03em; color:rgba(245,240,230,0.76); margin-top:16px;
        padding-top:14px; border-top:1px solid rgba(245,240,230,0.24); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"
         data-fps="24" data-duration="5">
      <div class="clip" id="card-clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="card" id="card">
          <div class="rule" id="rule"></div>
          <div class="kicker" id="kicker">The Operator Canvas</div>
          <div class="what" id="what">The four-number model and the thirty-day plan, free.</div>
          <div class="where" id="where">theoperatoreconomy.com</div>
        </div>
      </div>
    </div>
    <script>
      // Arrives on one vector, settles, holds, leaves. U-05: motion changes state then settles.
      const tl = gsap.timeline({ paused: true });
      tl.from("#card",   { opacity: 0, y: 26, duration: 0.42, ease: "power3.out" }, 0);
      tl.from("#rule",   { scaleY: 0, transformOrigin: "top center", duration: 0.34, ease: "power3.out" }, 0.06);
      tl.from("#kicker", { opacity: 0, y: 12, duration: 0.34, ease: "power3.out" }, 0.14);
      tl.from("#what",   { opacity: 0, y: 14, duration: 0.36, ease: "power3.out" }, 0.20);
      tl.from("#where",  { opacity: 0, y: 12, duration: 0.34, ease: "power3.out" }, 0.28);
      tl.to("#card",     { opacity: 0, duration: 0.40, ease: "power2.in" }, 4.55);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
