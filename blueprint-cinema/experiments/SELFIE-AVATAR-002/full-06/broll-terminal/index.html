<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <title>Week 2 B-roll — Claude Code in Warp</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: JBM; src: url("assets/JetBrainsMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
      @font-face { font-family: JBM; src: url("assets/JetBrainsMono-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 720px; height: 1280px; background: #111; overflow: hidden; }
      #broll { position: relative; width: 720px; height: 1280px; overflow: hidden; background: #111; }
      /* 941x1672 reference photo, scaled to the 720x1280 frame (same aspect). */
      #fit { position: absolute; left: 0; top: 0; width: 941px; height: 1672px; transform: scale(0.76514); transform-origin: 0 0; }
      #hand, #cam { position: absolute; inset: 0; width: 941px; height: 1672px; }
      #photo { position: absolute; inset: 0; width: 941px; height: 1672px; display: block; }

      #warp { position: absolute; left: 0; top: 0; width: 1000px; height: 725px; transform-origin: 0 0;
        background: #181a1f; border-radius: 18px; overflow: hidden;
        box-shadow: 0 30px 60px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.08);
        font-family: JBM, monospace; color: #e6e6e6; filter: blur(.45px); }
      #bar { height: 52px; background: #22252b; display: flex; align-items: center; padding: 0 22px; position: relative; border-bottom: 1px solid #30333a; }
      .dot { width: 16px; height: 16px; border-radius: 50%; margin-right: 10px; }
      #tab { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 21px; color: #aeb3bc; }
      #body { padding: 30px 38px; }
      #head { font-size: 22px; color: #8b9099; margin-bottom: 22px; }
      #head b { color: #d97757; font-weight: 700; }
      #box { border: 2px solid #5b606b; border-radius: 12px; padding: 16px 20px; font-size: 28px; line-height: 42px; white-space: nowrap; }
      #box .gt { color: #8b9099; }
      #cursor { display: inline-block; width: 17px; height: 36px; background: #e6e6e6; vertical-align: -7px; margin-left: 2px; }
      #out { margin-top: 30px; font-size: 30px; line-height: 44px; white-space: nowrap; }
      .row { opacity: 0; }
      .bullet { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #4fb477; margin-right: 18px; vertical-align: 2px; }
      .row b { color: #fff; }
      .arg { color: #c9ccd2; }
      .res { color: #7f848d; padding-left: 12px; }
      .elbow { display: inline-block; width: 16px; height: 20px; border-left: 2px solid #7f848d; border-bottom: 2px solid #7f848d; margin-right: 18px; vertical-align: 10px; }
      .done { color: #e6e6e6; }

      #glare { position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(118deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.07) 46%, rgba(255,255,255,0) 60%); }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.28) 100%); }
      #grain { position: absolute; inset: -20px; pointer-events: none; opacity: .09; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
    </style>
  </head>
  <body>
    <div id="broll" data-composition-id="week2-broll-terminal" data-start="0" data-width="720" data-height="1280" data-duration="2.5416666666666665">
      <div id="fit">
        <div id="hand">
          <div id="cam">
            <img id="photo" src="assets/macbook-reference.png" alt="" />
            <div id="warp">
              <div id="bar">
                <span class="dot" style="background:#ff5f57"></span>
                <span class="dot" style="background:#febc2e"></span>
                <span class="dot" style="background:#28c840"></span>
                <span id="tab">claude — ~/Example</span>
              </div>
              <div id="body">
                <div id="head"><b>Claude Code</b> &nbsp;·&nbsp; ~/Example</div>
                <div id="box" data-layout-allow-overlap><span class="gt">&gt; </span><span id="typed"></span><span id="cursor"></span></div>
                <div id="out" data-layout-allow-overlap>
                  <div class="row" id="r1"><span class="bullet"></span><b>Bash</b><span class="arg">(mv notes.txt Sources/)</span></div>
                  <div class="row res" id="r1b"><span class="elbow"></span>moved</div>
                  <div class="row" id="r2"><span class="bullet"></span><b>Bash</b><span class="arg">(mv *.png Assets/)</span></div>
                  <div class="row res" id="r2b"><span class="elbow"></span>moved</div>
                  <div class="row done" id="r3"><span class="bullet" style="background:#e6e6e6"></span>Done.</div>
                </div>
              </div>
            </div>
            <div id="glare"></div>
          </div>
        </div>
      </div>
      <div id="vignette"></div>
      <div id="grain"></div>
    </div>
    <script>
      // Map the 1000x725 window onto the laptop screen quad (reference-photo px),
      // matching the perspective of the Finder window in the same photo.
      const W = 1000, H = 725;
      const quad = [[55, 470], [930, 527], [892, 1181], [25, 1100]];
      function homography(src, dst) {
        const A = [], b = [];
        for (let i = 0; i < 4; i++) {
          const [x, y] = src[i], [u, v] = dst[i];
          A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
          A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
        }
        for (let c = 0; c < 8; c++) {
          let p = c;
          for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
          [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
          for (let r = 0; r < 8; r++) {
            if (r === c) continue;
            const f = A[r][c] / A[c][c];
            for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k];
            b[r] -= f * b[c];
          }
        }
        return b.map((v, i) => v / A[i][i]);
      }
      const [a, bb, c, d, e, f, g, h] = homography([[0, 0], [W, 0], [W, H], [0, H]], quad);
      const warp = document.getElementById("warp");
      warp.style.transform = `matrix3d(${a},${d},0,${g},${bb},${e},0,${h},0,0,1,0,${c},${f},0,1)`;
      const project = (x, y) => { const w = g * x + h * y + 1; return [(a * x + bb * y + c) / w, (d * x + e * y + f) / w]; };

      const text = "organize ~/Example into Sources and Assets";
      const typed = document.getElementById("typed");
      typed.innerHTML = [...text].map(ch => `<span class="ch" style="display:none">${ch === " " ? "&nbsp;" : ch}</span>`).join("");

      // Camera framing: center a window-space point in the frame at a given scale.
      const cam = document.getElementById("cam");
      cam.style.transformOrigin = "0 0";
      // Clamped so the photo always covers the frame, with room for the handheld drift.
      const M = 12, clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      const frameAt = (lx, ly, scale, cy = 760) => {
        const [px, py] = project(lx, ly);
        return { scale, x: clamp(470 - scale * px, 941 - 941 * scale + M, -M), y: clamp(cy - scale * py, 1672 - 1672 * scale + M, -M) };
      };
      const wide = frameAt(500, 300, 1.08, 800);   // whole window while the request types
      const tight = frameAt(300, 320, 1.5, 780);  // the two mv commands

      const tl = gsap.timeline({ paused: true });
      tl.set("#cam", wide, 0);
      tl.to(".ch", { display: "inline", duration: 0.001, stagger: 0.02, ease: "none" }, 0.06);
      tl.set("#typed", { color: "#9ba0a8" }, 0.98);
      tl.set("#cursor", { opacity: 0 }, 0.98);
      tl.fromTo("#r1", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, 1.08);
      tl.fromTo("#r1b", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 1.30);
      tl.fromTo("#r2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, 1.46);
      tl.fromTo("#r2b", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 1.68);
      tl.fromTo("#r3", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, 1.90);
      // Camera pushes in on the commands as they run.
      tl.to("#cam", { ...tight, duration: 1.4, ease: "power2.inOut" }, 0.9);
      // Handheld phone: slow, small drift for the whole shot.
      tl.fromTo("#hand", { x: 0, y: 0, rotation: 0 }, { x: -7, y: 6, rotation: 0.35, duration: 1.3, ease: "sine.inOut" }, 0);
      tl.to("#hand", { x: 5, y: -3, rotation: -0.2, duration: 1.2416, ease: "sine.inOut" }, 1.3);
      window.__timelines["week2-broll-terminal"] = tl;
    </script>
  </body>
</html>
