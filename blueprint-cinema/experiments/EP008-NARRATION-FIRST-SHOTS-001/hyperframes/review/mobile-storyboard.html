<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>EP008 mobile storyboard</title>
  <style>
    @font-face { font-family: "BL Boska"; src: url("../assets/fonts/boska-700.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "BL Zodiak"; src: url("../assets/fonts/zodiak-700.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "BL Supreme"; src: url("../assets/fonts/supreme-400.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-family: "BL Supreme"; src: url("../assets/fonts/supreme-500.woff2") format("woff2"); font-weight: 500; }
    :root {
      --paper: #F5F0E6;
      --paper-raised: #FBF8F1;
      --paper-inset: #EDE7D8;
      --mineral: #204440;
      --mineral-deep: #173530;
      --steel: #586D74;
      --steel-dark: #33464C;
      --ink: #19201F;
      --ink-soft: #303B39;
      --ink-muted: #566461;
      --rule: #D8CFB9;
    }
    * { box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); }
    body { font-family: "BL Supreme", Arial, sans-serif; }
    main { height: 100%; padding: 70px 72px 52px; display: grid; grid-template-rows: 205px 1fr 52px; gap: 28px; }
    header { border-bottom: 3px solid var(--mineral); display: grid; grid-template-columns: 1fr auto; align-content: start; gap: 8px 32px; }
    .eyebrow { font: 500 23px/1.15 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.1em; color: var(--steel-dark); text-transform: uppercase; }
    h1 { grid-column: 1 / -1; margin: 5px 0 0; font: 700 74px/0.94 "BL Boska", Georgia, serif; color: var(--mineral-deep); letter-spacing: -0.025em; }
    .deck { grid-column: 1 / -1; margin: 7px 0 0; font-size: 28px; line-height: 1.25; color: var(--ink-soft); max-width: 900px; }
    .cards { display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 30px; min-width: 0; min-height: 0; }
    article { position: relative; min-width: 0; background: var(--paper-raised); border: 2px solid var(--rule); padding: 34px 42px 34px 52px; overflow: hidden; }
    article::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 11px; background: var(--role-color); }
    article.human { --role-color: var(--paper-inset); }
    article.external { --role-color: var(--steel); }
    article.evidence { --role-color: var(--mineral); }
    .meta { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 24px; font: 500 24px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--steel-dark); }
    .role { min-width: 0; text-align: right; overflow-wrap: anywhere; text-transform: uppercase; letter-spacing: 0.07em; font-size: 20px; }
    h2 { margin: 19px 0 17px; font: 700 51px/1.02 "BL Zodiak", Georgia, serif; color: var(--mineral-deep); letter-spacing: -0.018em; }
    .visual { margin: 0 0 18px; font-size: 31px; line-height: 1.28; color: var(--ink); }
    .action { margin: 0 0 18px; padding: 14px 18px; background: var(--paper-inset); border-left: 5px solid var(--steel); font-size: 27px; line-height: 1.28; color: var(--ink-soft); }
    .label { font: 500 18px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-muted); }
    blockquote { margin: 8px 0 17px; font-size: 25px; line-height: 1.3; color: var(--ink-soft); }
    .visual, .action, blockquote, .guardrail { overflow-wrap: break-word; }
    .guardrail { margin: 0; font-size: 23px; line-height: 1.28; color: var(--ink-muted); }
    footer { display: flex; align-items: end; justify-content: space-between; border-top: 2px solid var(--rule); padding-top: 12px; font: 500 19px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.08em; color: var(--ink-muted); text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">EP008 · narration-first opening</div>
      <div class="eyebrow" id="page-label"></div>
      <h1>The job left undone</h1>
      <p class="deck">Eight causal shots. One order ticket carries the human problem through the system.</p>
    </header>
    <section class="cards" id="cards"></section>
    <footer><span>Pre-authority shot-plan preview</span><span>No frame art or animation yet</span></footer>
  </main>
  <script>
    const shots = [
      {
        n: "01", time: "00:00.000–00:05.680", role: "human context · establish", cls: "human",
        title: "The request enters reality",
        visual: "A real hand and personal device at night. One paper order ticket appears at the device edge.",
        action: "The ticket lands once, then stops. Its position becomes the continuity anchor into the helpdesk.",
        narration: "It's eleven at night, and somebody just typed “where is my order” into the chat box on a small online store.",
        guardrail: "No fake storefront UI, generic e-commerce montage, brand, credential, or solved request."
      },
      {
        n: "02", time: "00:05.680–00:14.320", role: "external dependency · trace", cls: "external",
        title: "The bought tool is already on",
        visual: "The same ticket sits inside the minimum steel geography: store, helpdesk perimeter, default agent.",
        action: "Reveal the existing route without animating a purchase or pretending activation equals implementation.",
        narration: "The store has an answer for this. It bought one. The founder switched on the AI agent that came with the help desk, because that's what it was sold to handle.",
        guardrail: "No magic AI glow, vendor logo, toggle theatre, or verified-success color."
      },
      {
        n: "03", time: "00:14.320–00:21.460", role: "external dependency · route", cls: "external",
        title: "The route reaches nobody",
        visual: "The persistent ticket moves from the agent toward a separate human queue. The support station is empty.",
        action: "Move the ticket exactly once on “hands.” Reveal 9:00 AM as the next accountable time, then hold.",
        narration: "The agent reads the message. And hands it to a human. There is no human. There'll be one at nine.",
        guardrail: "No alarm theatre, broken bot, angry customer, blame, or erased human workers."
      },
      {
        n: "04", time: "00:21.460–00:28.000", role: "external dependency · trace", cls: "external",
        title: "The fee mechanism remains attached",
        visual: "The unresolved ticket stays parked while a short steel relationship links store and vendor on a sparse ledger.",
        action: "Expose the billing mechanism only. The relationship is traced; no payment event occurs.",
        narration: "At the end of the month the help desk bills the store for every ticket the AI resolved. It's a short line.",
        guardrail: "No invented invoice, rate, amount, ticket count, transferred vendor rule, or payment animation."
      },
      {
        n: "05", time: "00:28.000–00:34.780", role: "external dependency · trace", cls: "external",
        title: "Two obligations, one request",
        visual: "Two real support workers receive visual weight; the unresolved ticket and short machine-fee trace remain distinct.",
        action: "Let the viewer count two human obligations and one machine obligation without moving money.",
        narration: "The founder is paying two people to answer “where is my order,” and paying a machine for the handful it did.",
        guardrail: "No salary, vendor amount, workforce-loss imagery, machine-success montage, or replacement claim."
      },
      {
        n: "06", time: "00:34.780–00:39.660", role: "human context · establish", cls: "human",
        title: "The work is present",
        visual: "The default agent occupies one boundary. An unfilled warm-paper span separates it from a working state.",
        action: "Make the open span the focal subject while the unresolved ticket stays visible as the reason it matters.",
        narration: "Between the day that store bought the AI and the day it works, there's a job.",
        guardrail: "No invented setup checklist, completed system, proof of demand, oxide commitment, or success state."
      },
      {
        n: "07", time: "00:39.660–00:46.460", role: "human context · establish", cls: "human",
        title: "One possible operator",
        visual: "One accountable operator enters the open span beside a prospective brand and a fair vendor boundary.",
        action: "Attribute the proposal to a person without depicting a sale, purchase, price, or completed service.",
        narration: "I think one person can sell it, at a fixed price, to stores the vendor won't set up by hand.",
        guardrail: "No heroic portrait, contract, amount, customer logo, partnership, refusal, or proof of solo demand."
      },
      {
        n: "08", time: "00:46.460–00:48.520", role: "human context · settle", cls: "human",
        title: "Hold the question open",
        visual: "The unresolved ticket returns to primary focus. The responsibility span remains empty between every actor.",
        action: "Nothing new moves. Freeze the unattended handoff and leave ownership unanswered.",
        narration: "The strange part is who left the job undone.",
        guardrail: "No blame, answer, title card, identity bumper, market proof, or promise of an outcome."
      }
    ];
    const requested = Number(new URLSearchParams(location.search).get("page") || "1");
    const page = Math.max(1, Math.min(4, requested));
    document.getElementById("page-label").textContent = `shots ${(page - 1) * 2 + 1}–${page * 2} · ${page}/4`;
    const host = document.getElementById("cards");
    for (const shot of shots.slice((page - 1) * 2, page * 2)) {
      const card = document.createElement("article");
      card.className = shot.cls;
      card.innerHTML = `<div class="meta"><span>SHOT ${shot.n} · ${shot.time}</span><span class="role">${shot.role}</span></div><h2>${shot.title}</h2><p class="visual">${shot.visual}</p><p class="action"><span class="label">Accountable change</span><br>${shot.action}</p><div class="label">Locked narration</div><blockquote>${shot.narration}</blockquote><p class="guardrail"><span class="label">Do not show</span> · ${shot.guardrail}</p>`;
      host.appendChild(card);
    }
  </script>
</body>
</html>
