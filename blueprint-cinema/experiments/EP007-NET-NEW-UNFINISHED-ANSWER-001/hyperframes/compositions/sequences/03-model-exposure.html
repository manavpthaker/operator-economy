      <script>
        window.__timelines = window.__timelines || {};

        const root = document.querySelector('[data-composition-id="ep007-model-exposure"]');
        const tl = gsap.timeline({ paused: true });

        const prepare = (selector) => {
          const marks = Array.from(root.querySelectorAll(selector));
          marks.forEach((mark) => {
            const length = mark.getTotalLength();
            mark.style.strokeDasharray = `${length}`;
            mark.style.strokeDashoffset = `${length}`;
          });
          return marks;
        };

        const draw = (marks, start, duration, step) => {
          marks.forEach((mark, index) => {
            tl.to(
              mark,
              { strokeDashoffset: 0, duration, ease: "power2.out" },
              start + index * step,
            );
          });
        };

        const construction = prepare(".construction-mark path");
        const contour = prepare(".business-contour path");
        const structure = prepare(".business-structure path");
        const owner = prepare(".owner-figure path");
        const hatch = prepare(".hatch-mark path");
        const dependencies = prepare(".dependency-route path");

        // Staged reveals: carrier line -> business -> person -> existing dependency -> settle.
        draw(construction, 0.12, 0.34, 0.045);
        draw(contour, 0.42, 0.34, 0.055);
        draw(structure, 1.18, 0.28, 0.035);
        draw(owner, 2.35, 0.30, 0.042);
        draw(hatch, 3.42, 0.22, 0.028);
        draw(dependencies, 3.78, 0.42, 0.075);

        window.__timelines["ep007-model-exposure"] = tl;
      </script>
