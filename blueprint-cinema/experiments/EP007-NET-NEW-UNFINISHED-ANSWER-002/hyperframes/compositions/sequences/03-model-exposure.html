      <script>
        window.__timelines = window.__timelines || {};

        const root = document.querySelector('[data-composition-id="ep007-model-exposure"]');
        const tl = gsap.timeline({ paused: true });

        const prepare = (selector) => {
          const marks = Array.from(root.querySelectorAll(selector));
          marks.forEach((mark) => {
            const length = mark.getTotalLength();
            mark.style.strokeDasharray = `${length}`;
            mark.style.strokeDashoffset = `${length}`;
            mark.style.opacity = "0";
          });
          return marks;
        };

        const draw = (marks, start, duration, step) => {
          marks.forEach((mark, index) => {
            const at = start + index * step;
            tl.set(mark, { opacity: 1 }, at);
            tl.to(mark, { strokeDashoffset: 0, duration, ease: "power2.out" }, at);
          });
        };

        const interval = prepare(".interval-mark path");
        const units = prepare(".unit path");
        const hatching = prepare(".unit-hatch path");
        const routes = prepare(".dependency-route path");
        const handoff = prepare(".handoff-ring path");
        const owner = prepare(".owner-presence path");
        const stopCap = prepare(".stop-cap path");

        // The first arithmetic resolves the four existing marks into a one-month sequence.
        tl.fromTo(
          "#ep007-b3-month-label",
          { opacity: 0 },
          { opacity: 1, duration: 0.18, ease: "power1.out", immediateRender: false },
          0.42,
        );
        draw(interval, 0.38, 0.28, 0.055);
        draw(units, 0.72, 0.24, 0.035);
        draw(hatching, 1.25, 0.20, 0.035);

        // Existing work repeatedly reaches the same owner touchpoint.
        draw(handoff, 1.18, 0.24, 0.045);
        draw(owner, 1.22, 0.24, 0.035);
        draw(routes, 1.42, 0.30, 0.04);

        tl.set("#ep007-b3-token-one", { opacity: 1 }, 1.64);
        tl.to("#ep007-b3-token-one", { x: 1040, y: 184, duration: 0.38, ease: "power2.inOut" }, 1.64);
        tl.to("#ep007-b3-token-one", { opacity: 0, duration: 0.10, ease: "none" }, 2.02);

        tl.set("#ep007-b3-token-two", { opacity: 1 }, 2.08);
        tl.to("#ep007-b3-token-two", { x: 778, y: 184, duration: 0.36, ease: "power2.inOut" }, 2.08);
        tl.to("#ep007-b3-token-two", { opacity: 0, duration: 0.10, ease: "none" }, 2.44);

        tl.set("#ep007-b3-token-three", { opacity: 1 }, 2.48);
        tl.to("#ep007-b3-token-three", { x: 517, y: 184, duration: 0.34, ease: "power2.inOut" }, 2.48);
        tl.to("#ep007-b3-token-three", { opacity: 0, duration: 0.10, ease: "none" }, 2.82);

        // At the second arithmetic, the owner is outside the interval; the handoff stays behind.
        tl.to(
          "#ep007-b3-owner-presence",
          { x: 220, y: -12, duration: 0.20, ease: "power3.inOut" },
          2.82,
        );

        // The next unit follows the already-understood route and stops at the vacancy on “not.”
        tl.set("#ep007-b3-token-four", { opacity: 1 }, 3.55);
        tl.to(
          "#ep007-b3-token-four",
          { x: 205, y: 172, duration: 1.18, ease: "power2.inOut" },
          3.55,
        );
        draw(stopCap, 4.66, 0.22, 0.07);

        window.__timelines["ep007-model-exposure"] = tl;
