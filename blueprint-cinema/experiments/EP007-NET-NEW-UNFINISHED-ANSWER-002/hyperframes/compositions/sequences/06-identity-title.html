      <script>
        (() => {
          "use strict";
          const root = document.querySelector('[data-composition-id="ep007-identity-title"]');
          const tl = gsap.timeline({ paused: true });
          const modelBase = root.querySelector("#ep007-identity-model-base");

          // SVG <use> instances do not reliably inherit class-driven presentation in every
          // capture engine. Freeze the semantic material onto the source marks as attributes so
          // the opening and title copies render identically.
          const widths = { w1: "2.1", w2: "3", w3: "4.2", w4: "5.6" };
          const opacities = { faint: "0.32", soft: "0.58", firm: "0.9" };
          modelBase.querySelectorAll("path").forEach((mark) => {
            if (mark.classList.contains("model-wash")) {
              mark.setAttribute("fill", "#204440");
              mark.setAttribute("fill-opacity", "0.035");
              mark.setAttribute("stroke", "none");
              return;
            }

            mark.setAttribute("fill", "none");
            mark.setAttribute(
              "stroke",
              mark.classList.contains("steel") ? "#586d74" : "#204440",
            );
            mark.setAttribute("stroke-linecap", "round");
            mark.setAttribute("stroke-linejoin", "round");
            mark.setAttribute("vector-effect", "non-scaling-stroke");

            Object.entries(widths).forEach(([className, value]) => {
              if (mark.classList.contains(className)) mark.setAttribute("stroke-width", value);
            });
            Object.entries(opacities).forEach(([className, value]) => {
              if (mark.classList.contains(className)) mark.setAttribute("opacity", value);
            });
          });

          // Scene 05 leaves these draw-on groups at full opacity with their measured dash
          // pattern settled at zero. Reproduce that final raster state before adding oxide.
          root
            .querySelectorAll(
              "#ep007-identity-opening-model .business-envelope path, " +
                "#ep007-identity-opening-model .business-context path, " +
                "#ep007-identity-opening-model .business-hatch path",
            )
            .forEach((mark) => {
              const length = mark.getTotalLength();
              mark.style.strokeDasharray = `${length}`;
              mark.style.strokeDashoffset = "0";
              mark.style.opacity = "1";
            });

          const brace = Array.from(
            root.querySelectorAll("#ep007-identity-opening-model .oxide-brace path"),
          );

          brace.forEach((mark) => {
            const length = mark.getTotalLength();
            mark.style.strokeDasharray = `${length}`;
            mark.style.strokeDashoffset = `${length}`;
          });

          // One finite practice path draws during the quiet beat and stops unfinished at 2.20.
          brace.slice(0, 4).forEach((mark, index) => {
            tl.to(
              mark,
              { strokeDashoffset: 0, duration: 0.50, ease: "power2.out" },
              index * 0.36,
            );
          });
          brace.slice(4).forEach((mark, index) => {
            tl.to(
              mark,
              { strokeDashoffset: 0, duration: 0.33, ease: "power2.out" },
              1.43 + index * 0.22,
            );
          });

          // Deep mineral replaces paper on the hard clip boundary at 4.02.
          tl.fromTo(
            "#oe-wordmark",
            { opacity: 0 },
            { opacity: 1, duration: 0.28, ease: "power1.out", immediateRender: false },
            4.10,
          );

          // Permanent accumulative reveals: exact spoken starts, no highlighting or motion.
          tl.set("#ep007-identity-build", { opacity: 1 }, 7.58);
          tl.set("#ep007-identity-own", { opacity: 1 }, 8.10);
          tl.set("#ep007-identity-operate", { opacity: 1 }, 8.66);

          // The title field itself hard-cuts at 11.54; its contents settle without flourish.
          tl.fromTo(
            "#title-working-model",
            { opacity: 0 },
            { opacity: 1, duration: 0.18, ease: "none", immediateRender: false },
            11.54,
          );
          tl.fromTo(
            "#episode-title",
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.32, ease: "power2.out", immediateRender: false },
            11.72,
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["ep007-identity-title"] = tl;
        })();
      </script>
