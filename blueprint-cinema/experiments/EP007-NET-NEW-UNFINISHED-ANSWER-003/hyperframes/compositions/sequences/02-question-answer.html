          const root = document.querySelector('[data-composition-id="ep007-question-answer"]');
          const tl = gsap.timeline({ paused: true });

          const prepare = (selector) => {
            const marks = Array.from(root.querySelectorAll(selector));
            marks.forEach((mark) => {
              const length = mark.getTotalLength();
              mark.style.strokeDasharray = `${length}`;
              mark.style.strokeDashoffset = `${length}`;
              mark.style.opacity = "0";

            return marks;
          };

          const draw = (marks, start, duration, step) => {
            marks.forEach((mark, index) => {
              const at = start + index * step;
              tl.set(mark, { opacity: 1 }, at);
              tl.to(mark, { strokeDashoffset: 0, duration, ease: "power2.out" }, at);
            });
          };

          const ticket = prepare("#physical-ticket path");
          const route = prepare("#physical-route path");
          const owner = prepare("#physical-owner path");
          const unfinished = prepare("#physical-unfinished-leg path");

            0.10,

          draw(owner, 5.38, 0.24, 0.055);
