      <script>
        (() => {
          "use strict";
          const root = document.querySelector('[data-composition-id="ep007-model-exposure"]');
          const tl = gsap.timeline({ paused: true });

          const prepare = (selector) => {
            const marks = Array.from(root.querySelectorAll(selector));
            marks.forEach((mark) => {
              const length = mark.getTotalLength();
              // Retain the authored pressure. The old reveal forced every faint
              // correction to opacity 1, flattening the drawing into hard ink.
              mark.dataset.pencilOpacity = getComputedStyle(mark).opacity;
              mark.style.strokeDasharray = `${length}`;
              mark.style.strokeDashoffset = `${length}`;
              mark.style.opacity = "0";
            });
            return marks;
          };

          const draw = (marks, start, duration, revealWindow) => {
            marks.forEach((mark, index) => {
              // More pencil fragments must not stretch an established VO cue.
              const at = start + (marks.length > 1 ? index / (marks.length - 1) : 0) * revealWindow;
              tl.set(mark, { opacity: Number(mark.dataset.pencilOpacity) }, at);
              tl.to(mark, { strokeDashoffset: 0, duration, ease: "power2.out" }, at);
            });
          };

          const rule = prepare(".equation-rule path");
          const relationships = prepare("#node-relationships path");
          const process = prepare("#node-process path");
          const records = prepare("#node-records path");
          const routes = prepare(".dependency-route path");
          const gate = prepare("#owner-gate path");
          const person = prepare("#owner-person path");
          const bracket = prepare("#absence-bracket path");
          const token = prepare("#work-token path");
          const stop = prepare("#stop-mark path");

          // Cut on Because into an already visible evidence anchor, then reveal arithmetic.
          tl.set("#model-evidence", { opacity: 1, y: 0 }, 0);
          tl.fromTo(
            "#equation-business",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.26, ease: "power2.out", immediateRender: false },
            0.24,
          );
          tl.fromTo(
            "#equation-owner",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.26, ease: "power2.out", immediateRender: false },
            1.22,
          );
          draw(rule, 1.90, 0.34, 0.10);
          tl.fromTo(
            "#equation-result",
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.22, ease: "power2.out", immediateRender: false },
            2.38,
          );

          // The second half of the sentence explains why the result is unresolved.
          draw(relationships, 3.12, 0.22, 0.175);
          draw(process, 3.33, 0.22, 0.210);
          draw(records, 3.575, 0.22, 0.175);
          [
            ["#label-relationships", 3.24],
            ["#label-process", 3.54],
            ["#label-records", 3.84],
            ["#label-owner", 4.02],
          ].forEach(([selector, at]) => {
            tl.fromTo(
              selector,
              { opacity: 0, x: -8 },
              { opacity: 1, x: 0, duration: 0.18, ease: "power2.out", immediateRender: false },
              at,
            );
          });
          draw(gate, 3.68, 0.22, 0.220);
          draw(person, 3.94, 0.22, 0.180);
          draw(routes, 4.04, 0.34, 0.440);

          // One month moves the person, not the business. The gate and dependencies remain.
          draw(bracket, 4.42, 0.22, 0.180);
          tl.fromTo(
            "#label-absence",
            { opacity: 0 },
            { opacity: 1, duration: 0.16, ease: "power1.out", immediateRender: false },
            4.46,
          );
          tl.to(
            "#owner-person",
            { x: 260, y: -4, duration: 0.34, ease: "power3.inOut" },
            4.72,
          );

          // One persistent work item reaches the now-empty checkpoint and stops.
          draw(token, 4.62, 0.18, 0.140);
          tl.to(
            "#work-token",
            { x: 204, y: -1, duration: 0.82, ease: "power2.inOut" },
            4.86,
          );
          draw(stop, 5.42, 0.20, 0.160);

          // 33.62–35.08: the unresolved state is held to this review's end. Stillness is the consequence.

          window.__timelines = window.__timelines || {};
          window.__timelines["ep007-model-exposure"] = tl;
        })();
      </script>
