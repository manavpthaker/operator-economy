<script>
window.__timelines=window.__timelines||{};
const t=gsap.timeline({paused:true});
// Master 782.5 + cue. Word anchors from word-transcript.json.
const C={"invoice":4.54,"model":6.54,"fixed":8.50,"shape":11.66,"house":14.48,"agent":16.22,"completes":17.54,"surveyor":18.90,"looking":19.78,"ornot":20.86,"jobs":23.22,"risk":24.42,"you":27.98};
const draw=(sel,at,d)=>{const p=document.querySelector(sel);const L=p.getTotalLength();t.set(sel,{autoAlpha:1,strokeDasharray:L,strokeDashoffset:L},at);t.to(sel,{strokeDashoffset:0,duration:d,ease:'power1.inOut'},at)};
const fade=(sel,at,d=10/24)=>t.fromTo(sel,{autoAlpha:0},{autoAlpha:1,duration:d,ease:'power1.out'},at);
// "It does not just change your invoice."
t.fromTo('#invoice',{autoAlpha:0,x:16},{autoAlpha:1,x:0,duration:.4,ease:'power2.out'},C.invoice);
// "It decides your entire model." The invoice is a detail; the card is the business.

// "Fixed fee is not a preference here."

t.to(['#model','#h1'],{autoAlpha:0,duration:.5,ease:'power1.inOut'},C.house-.3);

fade('#agent',C.agent,.4);
fade('#done',C.completes-.3,.4);
draw('#apay',C.completes,.8);

fade('#surv',C.surveyor,.4);

fade('#spay-l',C.looking+.3,.35);
fade('#spay-l2',C.ornot,.35);
// "Those are different jobs with different risk"
t.to('#apay',{strokeDasharray:'12 10',duration:.01},C.risk);
fade('#risk',C.risk+.1,.35);
// "You are the surveyor."
fade('#you',C.you,.4);
fade('#h2',C.you+.15);
