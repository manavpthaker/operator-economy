<script>
window.__timelines=window.__timelines||{};
const t=gsap.timeline({paused:true});
// Master 691.0 + cue. Word anchors from word-transcript.json.
const C={"what":0.44,"engagement":4.10,"business":5.25,"scope":6.52,"fee":7.56,"baseline":8.86,"interview":12.08,"write":13.20,"clean":16.76,"customers":21.04,"only":24.96,"move":27.98,"assemble":30.25,"walk":32.92,"fixed":34.10,"didnot":35.24};
