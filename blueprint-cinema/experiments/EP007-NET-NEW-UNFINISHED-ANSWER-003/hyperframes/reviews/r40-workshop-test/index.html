<script>
window.__timelines=window.__timelines||{};
const t=gsap.timeline({paused:true});
const C={ask:.55,point:1.55,answer:2.15,fit:2.75,finish:3.65,leave:4.7,next:6.3,askAgain:7.2,look:8.45,settle:9.5};
function arm(selector,path,hand,x,y,time,duration){t.to(selector,{attr:{d:path},duration,ease:'power2.inOut'},time);t.to(hand,{x,y,duration,ease:'power2.inOut'},time)}
t.set('#r40-owner-hand',{x:915,y:457},0);
t.set('#r40-project-two',{x:95},0);
t.set('#r40-worker-left-hand',{x:493,y:439},0);t.set('#r40-worker-right-hand',{x:593,y:439},0);

t.set('#r40-worker-head',{svgOrigin:'411 305'},0);t.set('#r40-owner-head',{svgOrigin:'926 317'},0);
t.set('#r40-owner-leg-left',{svgOrigin:'921 517'},0);t.set('#r40-owner-leg-right',{svgOrigin:'955 517'},0);
// Two samples are physically offered in the employee's hands.
arm('.r40-worker-left','M375 341 Q431 383 539 389','#r40-worker-left-hand',539,389,C.ask,.65);
arm('.r40-worker-right','M450 341 Q546 370 670 389','#r40-worker-right-hand',670,389,C.ask,.65);
t.to('#r40-knob',{x:0,y:-42,duration:.65,ease:'power2.inOut'},C.ask);
t.to('#r40-pull',{x:0,y:-42,duration:.65,ease:'power2.inOut'},C.ask);
t.to('#r40-worker-head',{rotation:-7,duration:.4,ease:'power2.inOut'},C.ask+.1);
// A brief weighing gesture makes these alternatives, not loose parts in use.
arm('.r40-worker-left','M375 341 Q431 368 539 373','#r40-worker-left-hand',539,373,1.25,.2);
t.to('#r40-knob',{y:-58,duration:.2,ease:'power2.inOut'},1.25);
arm('.r40-worker-left','M375 341 Q431 383 539 389','#r40-worker-left-hand',539,389,1.47,.2);
t.to('#r40-knob',{y:-42,duration:.2,ease:'power2.inOut'},1.47);
// Owner's finger identifies one option before the employee uses it.
arm('.r40-owner-arm','M889 344 Q812 365 716 375','#r40-owner-hand',716,375,C.point,.55);
t.to('#r40-owner-head',{rotation:-6,duration:.45,ease:'power2.inOut'},C.point);
t.set('#r40-choice',{autoAlpha:1},C.answer);t.set('#r40-choice',{autoAlpha:0},C.answer+.45);
t.to('#r40-owner-head',{rotation:-1,duration:.28,ease:'power2.inOut'},C.answer);
// The chosen pull moves with the working hand and attaches to the drawer.
arm('.r40-worker-right','M450 341 Q527 394 625 458','#r40-worker-right-hand',625,458,C.fit,.65);
t.to('#r40-pull',{x:-39,y:32,duration:.65,ease:'power2.inOut'},C.fit);
arm('.r40-worker-left','M375 341 Q406 408 468 470','#r40-worker-left-hand',468,470,C.fit,.6);
t.to('#r40-knob',{x:-77,y:45,duration:.6,ease:'power2.inOut'},C.fit);
t.to('#r40-worker-head',{rotation:12,duration:.4,ease:'power2.inOut'},C.fit);
t.to('#r40-worker-right-hand',{rotation:-13,duration:.16,repeat:1,yoyo:true,ease:'power1.inOut'},C.fit+.72);
arm('.r40-owner-arm','M889 344 Q875 397 915 457','#r40-owner-hand',915,457,C.fit+.2,.65);
// Completed drawer stays in the room; no success label is needed.
t.to('#r40-project-one',{x:-225,duration:.72,ease:'power2.inOut'},C.finish);
t.to('#r40-pull',{x:-264,duration:.72,ease:'power2.inOut'},C.finish);
arm('.r40-worker-right','M450 341 Q455 406 406 458','#r40-worker-right-hand',406,458,C.finish,.72);
t.to('#r40-worker-head',{rotation:0,duration:.5,ease:'power2.inOut'},C.finish+.5);
// A finite walking action takes the owner out through the right side.
t.to('#r40-owner',{x:440,duration:1.55,ease:'power1.inOut'},C.leave);
t.to('#r40-owner-leg-left',{rotation:9,duration:.26,repeat:4,yoyo:true,ease:'power1.inOut'},C.leave);
t.to('#r40-owner-leg-right',{rotation:-8,duration:.26,repeat:4,yoyo:true,ease:'power1.inOut'},C.leave);
// A new door and new hardware pose a different decision.
arm('.r40-worker-right','M450 341 Q580 422 756 455','#r40-worker-right-hand',756,455,C.next,.65);
t.set(['#r40-hinge-small','#r40-hinge-large'],{autoAlpha:1,y:40},C.askAgain);

arm('.r40-worker-right','M450 341 Q546 370 670 389','#r40-worker-right-hand',670,389,C.askAgain,.65);
t.to(['#r40-hinge-small','#r40-hinge-large'],{y:-42,duration:.65,ease:'power2.inOut'},C.askAgain);
t.to('#r40-worker-head',{rotation:-7,duration:.45,ease:'power2.inOut'},C.askAgain);
arm('.r40-worker-left','M375 341 Q431 368 539 373','#r40-worker-left-hand',539,373,7.88,.2);
t.to('#r40-hinge-small',{y:-58,duration:.2,ease:'power2.inOut'},7.88);

t.to('#r40-hinge-small',{y:-42,duration:.2,ease:'power2.inOut'},8.12);
