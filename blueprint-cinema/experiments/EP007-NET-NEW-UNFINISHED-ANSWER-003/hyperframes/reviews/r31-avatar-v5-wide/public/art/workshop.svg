      <path d="m177 196-1 24 18 1m-14-22 1 17 12 1" stroke="#173530" stroke-width="1.6"/>
      <path d="m216 196 9-1 2 10-9 1Zm12 4 46 10-5 9-41-14m5 1 2 4m5-2 2 4m5-2 2 4m5-2 2 4" stroke="#173530" stroke-width="1.3"/>
