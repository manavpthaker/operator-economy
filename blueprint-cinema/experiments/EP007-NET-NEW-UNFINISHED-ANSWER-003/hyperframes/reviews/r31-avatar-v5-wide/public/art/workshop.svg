<svg xmlns="http://www.w3.org/2000/svg" width="440" height="330" viewBox="0 0 440 330" role="img" aria-labelledby="workshop-title workshop-desc">
  <title id="workshop-title">Small woodworking workshop</title>
  <desc id="workshop-desc">A roughly drawn woodworking business with a sawtooth roof, window panes, timber shelving, hanging tools and a broad workbench across the open working bay. No photograph or person is included.</desc>
  <!-- The business is entirely illustrated. The former 320x180 footage bay
       now contains a paper-backed workshop interior. Exterior canvas is transparent. -->
  <g id="workshop-paper" fill="#F5F0E6" fill-opacity=".58">
    <path d="M17 89 112 33 114 87 242 31 245 87 373 35 376 89 413 91 414 305 16 305Z M35 115H355V295H35Z" fill-rule="evenodd"/>
    <path d="m25 91 78-47 2 47Zm102-1 106-48 1 48Zm130 1 107-47 2 48Z" fill="#FBF8F1" fill-opacity=".72"/>
  </g>
