<script>
(() => {
 const tl=gsap.timeline({paused:true});
 // Each mark keeps its authored pressure. Only a finite measured reveal changes.
 // Explicit endpoints make arbitrary and reverse seeks independent of playback.
 function revealPaths(paths, start, duration, spread) {
   paths.forEach((path,index) => {
     const length=path.getTotalLength()+2;
     tl.fromTo(path,
       {strokeDasharray:length,strokeDashoffset:length},
       {strokeDasharray:length,strokeDashoffset:0,duration:duration-spread,ease:"none"},
       start+(paths.length>1 ? spread*index/(paths.length-1) : 0));
   });
 }
 function establishGroup(id,start,duration) {
   const group=document.getElementById(id);
   tl.fromTo(group,{opacity:0},{opacity:1,duration:0.01,ease:"none"},start);
   revealPaths(Array.from(group.querySelectorAll("path")),start,duration,0.12);
 }
 tl.fromTo("#r5-month",{opacity:0,y:8},
   {opacity:1,y:0,duration:0.26,ease:"power1.out"},1);
