<script>
window.__timelines=window.__timelines||{};
const t=gsap.timeline({paused:true});
// Master 812.0 + cue. Word anchors from word-transcript.json.
const C={"promising":3.28,"notsale":5.50,"whether":7.12,"when":8.28,"howmuch":8.96,"half":9.97,"checklist":14.88,"resolved":16.84,"deferred":17.60,"scope":18.76,"signs":20.72,"acceptance":22.32,"line":25.20,"payment":28.52,"regulated":31.14};
const draw=(sel,at,d)=>{const p=document.querySelector(sel);const L=p.getTotalLength();t.set(sel,{autoAlpha:1,strokeDasharray:L,strokeDashoffset:L},at);t.to(sel,{strokeDashoffset:0,duration:d,ease:'power1.inOut'},at)};

// "What are you actually promising." The sale is already on screen, and it is not the answer.
fade('#h1',0.5);
t.to('#sale',{opacity:.5,duration:.4,ease:'power1.inOut'},C.notsale);
[['#u1','whether'],['#u2','when'],['#u3','howmuch']].forEach(([s,k])=>t.fromTo(s,{autoAlpha:0,y:8},{autoAlpha:1,y:0,duration:.35,ease:'power2.out'},C[k]));

t.to(['#ownerg','#unknowns'],{autoAlpha:.25,duration:.5,ease:'power1.inOut'},C.checklist-.5);

t.to('#h1',{autoAlpha:0,duration:.3,ease:'power1.inOut'},C.acceptance-.2);
