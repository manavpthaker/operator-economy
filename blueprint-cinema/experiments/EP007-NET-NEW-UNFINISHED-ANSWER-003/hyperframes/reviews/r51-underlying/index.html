<script>
window.__timelines=window.__timelines||{};
// Locked R50 end state.
{
const t=gsap.timeline({paused:true});
const r49=gsap.timeline({paused:true});
const C49={"swap":0.70,"routes":2.08,"most":3.14,"ties":4.80};
// New shape named on its word; relationship ties clear and customers regroup for the revenue view.
r49.to('#r49-heading-old',{autoAlpha:0,duration:.35,ease:'power1.inOut'},C49.swap);
r49.to('#r49-heading-new',{autoAlpha:1,duration:10/24,ease:'power2.out'},C49.swap+.2);
r49.to('#r49-old-ties',{autoAlpha:0,duration:.35,ease:'power1.inOut'},C49.swap);
r49.to('#r49-c1',{y:-48,duration:.6,ease:'power2.inOut'},C49.swap);
r49.to('#r49-c2',{y:-83,duration:.6,ease:'power2.inOut'},C49.swap);
r49.to('#r49-c3',{y:-118,duration:.6,ease:'power2.inOut'},C49.swap);
r49.fromTo('#r49-c4',{autoAlpha:0,x:18},{autoAlpha:1,x:0,duration:.45,ease:'power2.out'},C49.swap+.35);
// Every customer pays into the business at equal weight first.
['#r49-route-1','#r49-route-2','#r49-route-3','#r49-route-4'].forEach((id,i)=>{const p=document.querySelector(id);const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;r49.set(id,{autoAlpha:1},C49.routes+i*.08);r49.to(id,{strokeDashoffset:0,duration:.75,ease:'power1.inOut'},C49.routes+i*.08)});
r49.to(['.arrow','#r49-revenue-label'],{autoAlpha:1,duration:.3,ease:'power1.out'},C49.routes+.7);
// On "most", two routes carry visibly more.
r49.to(['#r49-route-1','#r49-route-2'],{strokeWidth:10,stroke:'#173530',duration:.5,ease:'power2.out'},C49.most);
// Both heavy clients came in through her: ties return only for them, ending at her empty place.
['#r49-tie-1','#r49-tie-2'].forEach((id,i)=>{const p=document.querySelector(id);const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;r49.set(id,{autoAlpha:1},C49.ties+i*.14);r49.to(id,{strokeDashoffset:0,duration:.7,ease:'power1.inOut'},C49.ties+i*.14)});

r49.progress(1);
const C={"clear":0.07,"heading":1.43,"receipts":3.63,"stranger":5.73,"look":6.37};
// Concentration layer clears on "And"; business, desk and Owner label stay.
t.to(['#r49-c1','#r49-c2','#r49-c3','#r49-c4','.route','.arrow','.new-tie','#r49-revenue-label'],{autoAlpha:0,duration:.4,ease:'power1.inOut'},C.clear);
t.to('#r49-heading-new',{autoAlpha:0,duration:.35,ease:'power1.inOut'},C.heading);
t.to('#r50-heading',{autoAlpha:1,duration:10/24,ease:'power2.out'},C.heading+.2);
// The accepted R46 past-revenue receipts: the business genuinely earns.
t.fromTo(['#r50-receipts','#r50-past-label'],{autoAlpha:0,y:10},{autoAlpha:1,y:0,duration:.5,ease:'power2.out'},C.receipts);
t.fromTo('#r50-stranger',{autoAlpha:0,x:18},{autoAlpha:1,x:0,duration:.45,ease:'power2.out'},C.stranger);
// Inspection reaches toward the records and stops short.
t.set('#r50-look',{autoAlpha:1,clipPath:'inset(0 0 0 100%)'},C.look);
t.to('#r50-look',{clipPath:'inset(0 0 0 0%)',duration:.8,ease:'power1.out'},C.look);
t.progress(1);
}
const t=gsap.timeline({paused:true});
const C={"clear":0.15,"recede":1.61,"look":3.51,"sheet":6.59,"head":8.61};
// Leave the list: the records heading clears on "Three different problems".
t.to('#r50-heading',{autoAlpha:0,duration:.4,ease:'power1.inOut'},C.clear);
// "Same underlying one": the records example steps back; it is not the answer.
t.to(['#r50-receipts','#r50-past-label'],{autoAlpha:.35,duration:.5,ease:'power1.inOut'},C.recede);
// The stranger's inspection turns from the receipts to the owner's empty place.
t.to('#r50-look',{autoAlpha:0,duration:.3,ease:'power1.inOut'},C.look);
t.set('#r51-look',{autoAlpha:1,clipPath:'inset(0 0 0 100%)'},C.look+.3);
t.to('#r51-look',{clipPath:'inset(0 0 0 0%)',duration:1.1,ease:'power1.out'},C.look+.3);
// "Not written down anywhere": an unfilled sheet at her desk.
t.fromTo('#r51-sheet',{autoAlpha:0,y:12},{autoAlpha:1,y:0,duration:.5,ease:'power2.out'},C.sheet);
// "It is in her head": her outline returns, dashed, where the look ends; she is still absent.
t.to('#r51-head',{autoAlpha:1,duration:.6,ease:'power1.inOut'},C.head);
window.__timelines['ep007-r51']=t;
