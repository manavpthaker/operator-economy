<script>
window.__timelines=window.__timelines||{};
const t=gsap.timeline({paused:true});
// Master 535.875 + cue. Word anchors from word-transcript.json.
const C={"at":0.345,"maturity":0.515,"handful":3.705,"accountants":4.225,"advisers":4.925,"meet":5.865,"years":7.105,"repeat":9.285,"work":9.685,"ready":11.085,"drifts":12.245,"back":12.685,"lighter":14.565,"cheaper":15.325,"owners":16.865,"full":18.525,"that":19.905,"business":20.845,"now":22.065,"you":23.265};
const draw=(sel,at,d)=>{const p=document.querySelector(sel);const L=p.getTotalLength();t.set(sel,{autoAlpha:1,strokeDasharray:L,strokeDashoffset:L},at);t.to(sel,{strokeDashoffset:0,duration:d,ease:'power1.inOut'},at)};
const fade=(sel,at,d=10/24)=>t.fromTo(sel,{autoAlpha:0},{autoAlpha:1,duration:d,ease:'power1.out'},at);
// "At maturity it looks like this": the scene clears; the practice moves to the centre.
t.to('#old',{autoAlpha:0,duration:.5,ease:'power1.inOut'},C.at);
t.to('#practice',{x:395,y:-192,duration:.8,ease:'power2.inOut'},C.at);
fade('#h-mat',C.maturity);
fade('#practice-n',C.at+.6);
// "a handful of accountants and advisers" with standing ties to the practice.
['#ad1','#ad2','#ad3','#ad4'].forEach((s,i)=>t.fromTo(s,{autoAlpha:0,x:-12},{autoAlpha:1,x:0,duration:.4,ease:'power2.out'},C.handful+i*.12));
fade('#ad-l',C.accountants);
['#st1','#st2','#st3','#st4'].forEach((s,i)=>draw(s,C.advisers+i*.1,.6));
// "who meet these owners years before anybody is ready": the three-years-out marker finally receives lines.
['#ow1','#ow2','#ow3'].forEach((s,i)=>t.fromTo(s,{autoAlpha:0,x:12},{autoAlpha:1,x:0,duration:.4,ease:'power2.out'},C.meet+i*.12));
fade('#ow-l',C.meet+.3);
fade('#three',C.years-.1);
['#m1','#m2','#m3'].forEach((s,i)=>draw(s,C.years+i*.1,.55));
// "Repeat work, because a business that gets ready once drifts back."
draw('#loop-out',C.repeat,.6);
fade('#biz-art',C.repeat+.3);
fade('#repeat',C.work);
fade('#ready',C.ready);
t.to('#biz',{x:22,y:10,duration:.7,ease:'power1.inOut'},C.drifts);
t.to('#biz-art',{opacity:.7,duration:.7,ease:'power1.inOut'},C.drifts);
t.to('#ready',{autoAlpha:0,duration:.5,ease:'power1.inOut'},C.drifts);
draw('#loop-back',C.back,.7);
// "Eventually a lighter, cheaper first product for owners who are not sure they need the full thing."
fade('#small-card',C.lighter);
fade('#lighter',C.cheaper);
fade('#owner-c',C.owners);
draw('#to-card',C.owners+.3,.3);
fade('#full-card',C.full);
draw('#to-full',C.full+.25,.35);
// "That is the business."
draw('#outline',C.that,1.0);
t.to('#h-mat',{autoAlpha:0,duration:.35,ease:'power1.inOut'},C.business-.2);
fade('#h-biz',C.business);
// "Now let us talk about whether you can build it."
t.to('#model',{scale:.62,x:-250,svgOrigin:'640 405',duration:.8,ease:'power2.inOut'},C.now);
fade('#you',C.you,.45);
window.__timelines['ep007-r57-s13cd']=t;
</script></body></html>
