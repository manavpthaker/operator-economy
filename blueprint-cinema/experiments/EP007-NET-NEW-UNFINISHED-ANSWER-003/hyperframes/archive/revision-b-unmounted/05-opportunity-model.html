      <script>
        window.__timelines = window.__timelines || {};

        const root = document.querySelector('[data-composition-id="ep007-opportunity-model"]');
        const tl = gsap.timeline({ paused: true });

        const prepare = (selector) => {
          const marks = Array.from(root.querySelectorAll(selector));
          marks.forEach((mark) => {
            const length = mark.getTotalLength();
            mark.style.strokeDasharray = `${length}`;
            mark.style.strokeDashoffset = `${length}`;
            mark.style.opacity = "0";
          });
          return marks;
        };

        const draw = (marks, start, duration, step) => {
          marks.forEach((mark, index) => {
            const at = start + index * step;
            tl.set(mark, { opacity: 1 }, at);
            tl.to(mark, { strokeDashoffset: 0, duration, ease: "power2.out" }, at);
          });
        };

        const envelope = prepare(".business-envelope path");
        const context = prepare(".business-context path");
        const hatching = prepare(".business-hatch path");

        // Expand around the known arithmetic. The stopped handoff remains the focal state.
        draw(envelope, 0.32, 0.30, 0.075);
        draw(context, 1.18, 0.24, 0.055);
        draw(hatching, 2.28, 0.20, 0.045);

        window.__timelines["ep007-opportunity-model"] = tl;
      </script>
