      const tl = window.gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};

      const key = select("#f08-key");
      const keyStatus = select("#f08-key-status-fill");

      const s2 = select("#f08-s2");
      const s34 = select("#f08-s34");
      const s34Headline = select("#f08-s34-headline");
      const routeLine = select("#f08-route-line");
      const property = select("#f08-property");
      const finalLine = select("#f08-final-line");

      tl.fromTo(
        key,
        { autoAlpha: 0.55, x: -24, scale: 0.96 },
        { autoAlpha: 1, x: 0, scale: 1, duration: 0.42, ease: "power3.out" },
        0
      );
      tl.fromTo(
        keyStatus,
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 1.35, ease: "power2.inOut" },
        0.18
      );

      const sceneOneStates = [
        { t: 0.00, text: "A GUEST" },
        { t: 0.42, text: "A GUEST IT CAN" },
        { t: 0.86, text: "A GUEST IT CAN WELCOME" },
        { t: 1.34, text: "A GUEST IT CAN WELCOME BACK" }
      ];
      const sceneOneTextAt = (time) => {
        for (let index = sceneOneStates.length - 1; index >= 0; index -= 1) {
          if (time >= sceneOneStates[index].t) return sceneOneStates[index].text;
        }
        return sceneOneStates[0].text;
      };
      const sceneOneDriver = { t: 0 };
      let lastSceneOneText = "A GUEST";

      tl.fromTo(
        s1Built,
        { autoAlpha: 0.45, y: 20 },
        { autoAlpha: 1, y: 0, duration: 0.34, ease: "power3.out" },
        0
      );
      tl.fromTo(
        s1Guide,
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 1.35, ease: "power2.inOut" },
        0.35
      );
      tl.to(
        sceneOneDriver,
        {
          t: 1.7,
          duration: 1.7,
          ease: "none",
          onUpdate: () => {
            const nextText = sceneOneTextAt(sceneOneDriver.t);
            if (nextText !== lastSceneOneText) {
              s1Built.textContent = nextText;
              lastSceneOneText = nextText;
            }
          }
        },
        0
      );
      tl.set(s1Direct, { autoAlpha: 0 }, 0);
      tl.set(s1Built, { autoAlpha: 0 }, 2.1);
      tl.set(s1Direct, { autoAlpha: 1 }, 2.1);
      tl.fromTo(
        s1Direct,
        { scale: 1.05 },
        { scale: 1, duration: 0.34, ease: "power3.out" },
        2.1
      );

      tl.to(s1, { x: -230, duration: 0.3, ease: "power4.in" }, 2.7);
      tl.to(s1, { autoAlpha: 0, duration: 0.18, ease: "power1.in" }, 2.82);
      tl.fromTo(
        s2,
        { x: 230, autoAlpha: 0.35 },
        { x: 0, autoAlpha: 1, duration: 0.3, ease: "power4.out" },
        3
      );
      tl.to(s2, { x: -230, duration: 0.3, ease: "power4.in" }, 5.9);
      tl.to(s2, { autoAlpha: 0, duration: 0.18, ease: "power1.in" }, 6.02);
      tl.fromTo(
        s34,
        { x: 230, autoAlpha: 0.35 },
        { x: 0, autoAlpha: 1, duration: 0.3, ease: "power4.out" },
        6.2
      );
      tl.fromTo(
        s34Headline,
        { scale: 0.96, autoAlpha: 0.7 },
        { scale: 1, autoAlpha: 1, duration: 0.8, ease: "power3.out" },
        6.28
      );

      const gateContent = [
        { selector: "#f08-gate-audit", label: "AUDIT", join: null, hold: 0.13 },
        { selector: "#f08-gate-permission", label: "PERMISSION", join: "#f08-join-permission", hold: 0.13 },
        { selector: "#f08-gate-qualify", label: "QUALIFY", join: "#f08-join-qualify", hold: 0.13 },
        { selector: "#f08-gate-human", label: "HUMAN REVIEW", join: "#f08-join-human", hold: 0.17 }
      ];
      const gateSequenceStart = 8.18;
      const baseDuration = 0.2;
      const secondsPerCharacter = 0.012;
      let cumulative = 0;
      const gateSchedule = gateContent.map((entry) => {
        const duration = baseDuration + entry.label.replace(/\s/g, "").length * secondsPerCharacter + entry.hold;
        const start = gateSequenceStart + cumulative;
        cumulative += duration;
        return { ...entry, start, end: gateSequenceStart + cumulative };
      });

      gateSchedule.forEach((entry) => {
        tl.fromTo(
          select(entry.selector),
          { autoAlpha: 0, y: 22 },
          { autoAlpha: 1, y: 0, duration: 0.26, ease: "power3.out" },
          entry.start
        );
        if (entry.join) {
          tl.fromTo(
            select(entry.join),
            { autoAlpha: 0, scaleX: 0, transformOrigin: "left center" },
            { autoAlpha: 1, scaleX: 1, duration: 0.22, ease: "power2.out" },
            entry.start - 0.08
          );
        }
      });

      tl.fromTo(
        routeLine,
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 1.15, ease: "power2.inOut" },
        10.2
      );
      tl.fromTo(
        property,
        { autoAlpha: 0, x: 30 },
        { autoAlpha: 1, x: 0, duration: 0.55, ease: "power3.out" },
        10.2
      );
