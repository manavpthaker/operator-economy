  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="03-loop-back"]');
      const world = document.getElementById("03-loop-back-world");
      const outboundPath = document.getElementById("03-loop-back-route-outbound");
      const returnPath = document.getElementById("03-loop-back-route-return");
      const checkPath = document.getElementById("03-loop-back-key-check-path");
      const repeatPath = document.getElementById("03-loop-back-repeat-path");
      const tokenCarrier = document.getElementById("03-loop-back-token-carrier");
      const token = document.getElementById("03-loop-back-token");
      const barrier = document.getElementById("03-loop-back-barrier");
      const keyTag = document.getElementById("03-loop-back-key-tag");
      const finalGate = document.getElementById("03-loop-back-final-core");

      const timeline = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["03-loop-back"] = timeline;

      const viewportWidth = root.clientWidth || 1920;
      const cam = { scale: 1, x: 0, y: 0 };
      const applyCamera = () => {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      };
      applyCamera();

      const prepareDraw = (path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
        return length;
      };

      const outboundLength = prepareDraw(outboundPath);
      const returnLength = prepareDraw(returnPath);
      prepareDraw(checkPath);
      prepareDraw(repeatPath);

      const placeToken = (path, length, progress) => {
        const point = path.getPointAtLength(length * progress);
        tokenCarrier.style.transform = `translate(${point.x}px, ${point.y}px)`;
      };

      const outboundDriver = { progress: 0 };
      const returnDriver = { progress: 0 };
      placeToken(outboundPath, outboundLength, 0);

      timeline.fromTo(
        barrier,
        { y: -64, rotation: -12 },
        { y: 0, rotation: 0, duration: 0.45, ease: "power2.out" },
        0.05
      );
      timeline.fromTo(
        token,
        { opacity: 0 },
        { opacity: 1, duration: 0.30, ease: "power1.out" },
        0.12
      );
      timeline.to(
        outboundPath,
        { strokeDashoffset: 0, duration: 2.65, ease: "none" },
        0.35
      );
      timeline.to(
        outboundDriver,
        {
          progress: 1,
          duration: 2.70,
          ease: "none",
          onUpdate: () => placeToken(outboundPath, outboundLength, outboundDriver.progress)
        },
        0.65
      );

      timeline.to(
        cam,
        {
          x: -viewportWidth,
          duration: 1.40,
          ease: "power3.inOut",
          onUpdate: applyCamera
        },
        2.00
      );
      timeline.fromTo(
        keyTag,
        { opacity: 0, rotationY: -90 },
        { opacity: 1, rotationY: 0, duration: 0.55, ease: "power2.out" },
        3.18
      );
      timeline.to(
        checkPath,
        { strokeDashoffset: 0, duration: 0.48, ease: "power2.out" },
        3.48
      );

      timeline.to(
        returnPath,
        { strokeDashoffset: 0, duration: 1.52, ease: "none" },
        4.20
      );
      timeline.to(
        returnDriver,
        {
          progress: 1,
          duration: 1.55,
          ease: "power2.inOut",
          onUpdate: () => placeToken(returnPath, returnLength, returnDriver.progress)
        },
        4.20
      );
      timeline.to(
        cam,
        {
          x: -2 * viewportWidth,
          duration: 1.55,
          ease: "power2.inOut",
          onUpdate: applyCamera
        },
        4.20
      );
      timeline.fromTo(
        finalGate,
        { opacity: 0.22, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.65, ease: "power2.out" },
        5.08
      );
      timeline.to(
        repeatPath,
        { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" },
        5.05
      );
    })();
