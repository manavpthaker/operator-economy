<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: sans-serif;
      }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #source-image { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; object-position: center; }
      code,
      pre,
      .monospace {
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.6"
      data-fps="25"
      data-width="1920"
      data-height="1080"
    >
      <img id="source-image" class="clip" data-start="0" data-duration="5.6" data-track-index="1" src="assets/study.webp" alt="Accepted candidate 03 held stationary for lip-sync source test">
      <audio id="locked-narration" data-start="0" data-duration="5.6" data-media-start="0" data-track-index="0" src="assets/narration.wav"></audio>

      <!--
        Add your clips here. Example:
        <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="1"
             style="font-size: 64px; color: #fff; padding: 40px">
          Hello World
        </div>
      -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Example: tl.from("#title", { opacity: 0, y: -50, duration: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
