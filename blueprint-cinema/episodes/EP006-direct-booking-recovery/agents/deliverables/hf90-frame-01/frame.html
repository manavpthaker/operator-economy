  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="01-same-guest"]');
      const byId = (id) => root.querySelector(`[id="${id}"]`);
      const tl = gsap.timeline({ paused: true });

      const sceneOne = byId("01-same-guest-scene-one");
      const sameGuest = byId("01-same-guest-same");
      const underline = byId("01-same-guest-underline");
      const keyGroup = byId("01-same-guest-key-group");
      const guestToken = byId("01-same-guest-guest-token");
      const ledgerOne = byId("01-same-guest-ledger-one");
      const ledgerTwo = byId("01-same-guest-ledger-two");
      const stampOne = byId("01-same-guest-stamp-one");
      const stampTwo = byId("01-same-guest-stamp-two");

      const WORDS = [
        { id: "01-same-guest-word-hotels", text: "HOTELS", speedFactor: 1.0 },
        { id: "01-same-guest-word-keep", text: "KEEP", speedFactor: 0.92 },
        { id: "01-same-guest-word-paying", text: "PAYING", speedFactor: 1.0 },
      ];

      let wordCursor = 0.08;
      const WORD_TIMELINE = WORDS.map((entry) => {
        const duration = (0.18 + entry.text.length * 0.026) * entry.speedFactor;
        const start = wordCursor;
        wordCursor += duration + 0.10;
        return { ...entry, start, duration };
      });

      WORD_TIMELINE.forEach((entry, index) => {
        tl.fromTo(
          byId(entry.id),
          {
            autoAlpha: 0,
            y: index % 2 === 0 ? "1.4cqh" : "-1.1cqh",
            clipPath: "inset(0 100% 0 0)",
          },
          {
            autoAlpha: 1,
            y: "0cqh",
            clipPath: "inset(0 0% 0 0)",
            duration: Math.min(0.42, entry.duration + 0.16),
            ease: "power2.out",
          },
          entry.start,
        );
      });

      tl.fromTo(
        keyGroup,
        { autoAlpha: 0, x: "0cqw", y: "3cqh" },
        { autoAlpha: 1, x: "0cqw", y: "0cqh", duration: 0.48, ease: "power2.out" },
        0.20,
      );

      tl.fromTo(
        ledgerOne,
        { autoAlpha: 0.16, scaleX: 0.08 },
        { autoAlpha: 0.78, scaleX: 1, duration: 0.72, ease: "power2.out" },
        1.05,
      );

      tl.set(ledgerTwo, { autoAlpha: 0.16, scaleX: 0.55 }, 0);
      tl.set(sameGuest, { autoAlpha: 0 }, 0);
      tl.set(sceneOne, { autoAlpha: 0 }, 2.20);
      tl.fromTo(
        sameGuest,
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.001, ease: "none" },
        2.20,
      );

      tl.fromTo(
        keyGroup,
        { x: "0cqw", y: "0cqh" },
        { x: "0cqw", y: "7cqh", duration: 0.55, ease: "power2.out" },
        2.20,
      );

      tl.fromTo(
        guestToken,
        { autoAlpha: 0, x: "-7cqw" },
        { autoAlpha: 1, x: "0cqw", duration: 0.62, ease: "back.out(1.55)" },
        2.42,
      );

      tl.fromTo(
        underline,
        { autoAlpha: 1, scaleX: 0 },
        { autoAlpha: 1, scaleX: 1, duration: 0.58, ease: "power2.inOut" },
        3.05,
      );

      tl.fromTo(
        ledgerTwo,
        { autoAlpha: 0.16, scaleX: 0.55 },
        { autoAlpha: 0.92, scaleX: 1, duration: 0.56, ease: "power2.out" },
        5.30,
      );

      tl.set(keyGroup, { x: "-32cqw", y: "18cqh" }, 5.30);
      tl.fromTo(
        keyGroup,
        { x: "-32cqw", y: "18cqh" },
        { x: "32cqw", y: "18cqh", duration: 1.78, ease: "power1.inOut" },
        5.30,
      );

      const PAYMENT_STATES = [
        { t: 0.00, first: "", second: "" },
        { t: 3.62, first: "PAID AGAIN", second: "" },
        { t: 6.64, first: "PAID AGAIN", second: "PAID AGAIN" },
      ];

      function paymentStateAt(time) {
        for (let i = PAYMENT_STATES.length - 1; i >= 0; i -= 1) {
          if (time >= PAYMENT_STATES[i].t) return PAYMENT_STATES[i];
        }
        return PAYMENT_STATES[0];
      }

      let lastPaymentKey = "";
      const paymentDriver = { t: 0 };
      tl.to(
        paymentDriver,
        {
          t: 8.284,
          duration: 8.284,
          ease: "none",
          onUpdate: () => {
            const state = paymentStateAt(paymentDriver.t);
            const stateKey = `${state.first}|${state.second}`;
            if (stateKey === lastPaymentKey) return;

            stampOne.textContent = state.first;
            stampTwo.textContent = state.second;
            stampOne.style.borderColor = state.first ? "#B08D3E" : "transparent";
            stampTwo.style.borderColor = state.second ? "#B08D3E" : "transparent";
            stampOne.style.color = state.first ? "#B08D3E" : "transparent";
            stampTwo.style.color = state.second ? "#B08D3E" : "transparent";
            lastPaymentKey = stateKey;
          },
        },
        0,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["01-same-guest"] = tl;
    })();
  </script>
