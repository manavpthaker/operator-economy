  <script>
    (() => {
      const episode = document.getElementById("06-episode-title-episode");
      const titleMain = document.getElementById("06-episode-title-title-main");
      const direct = document.getElementById("06-episode-title-direct");
      const recovery = document.getElementById("06-episode-title-recovery");
      const key = document.getElementById("06-episode-title-key");
      const thesisCard = document.getElementById("06-episode-title-thesis-card");
      const thesisLine1 = document.getElementById("06-episode-title-thesis-line-1");
      const thesisLine2 = document.getElementById("06-episode-title-thesis-line-2");

      const tl = gsap.timeline({ paused: true });

      tl.set(thesisCard, { autoAlpha: 0 }, 0);
      tl.fromTo(
        episode,
        { opacity: 0, y: -16 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power2.out" },
        0.08,
      );
      tl.fromTo(
        direct,
        { opacity: 0, yPercent: 105 },
        { opacity: 1, yPercent: 0, duration: 0.72, ease: "power3.out" },
        0.48,
      );
      tl.fromTo(
        recovery,
        { opacity: 0, yPercent: 105 },
        { opacity: 1, yPercent: 0, duration: 0.78, ease: "power3.out" },
        1.28,
      );

      tl.fromTo(
        key,
        { opacity: 0, y: -22, rotation: -2, scale: 0.96 },
        { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.58, ease: "power2.out" },
        2.72,
      );

      tl.set(titleMain, { autoAlpha: 0 }, 5.2);
      tl.set(thesisCard, { autoAlpha: 1 }, 5.2);

      const thesisSequence = [
        { t: 0, first: "", second: "" },
        { t: 0.14, first: "FIRST BOOKING: ACQUISITION", second: "" },
        {
          t: 1.02,
          first: "FIRST BOOKING: ACQUISITION",
          second: "NEXT APPROPRIATE BOOKING: DIRECT",
        },
      ];

      const thesisStateAt = (time) => {
        for (let index = thesisSequence.length - 1; index >= 0; index -= 1) {
          if (time >= thesisSequence[index].t) return thesisSequence[index];
        }
        return thesisSequence[0];
      };

      const thesisDriver = { t: 0 };
      tl.to(
        thesisDriver,
        {
          t: 2.332,
          duration: 2.332,
          ease: "none",
          onUpdate: () => {
            const state = thesisStateAt(thesisDriver.t);
            thesisLine1.textContent = state.first;
            thesisLine2.textContent = state.second;
          },
        },
        5.2,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["06-episode-title"] = tl;
