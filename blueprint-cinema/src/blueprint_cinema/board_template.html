<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6860; --line: #e2dfd6; --hover: #efede6;
  --active: #fff4d6; --active-line: #d9a520; --word: #d9a520;
  --locked: #2f7d4f; --flagged: #c0392b; --unreviewed: #8a867c;
  --film: #3f6fb5; --presenter: #b5553f; --model: #6b8e3f; --evidence: #8e5fb5; --screen: #2f8f8f; --sting: #9a8a5a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151513; --panel: #1f1e1b; --ink: #eceae3; --muted: #9c988d; --line: #33312c; --hover: #2a2925;
    --active: #3a321c; --active-line: #e0b440; --word: #e0b440;
    --locked: #56b07c; --flagged: #e5675a; --unreviewed: #8a867c;
    --film: #6f9ae0; --presenter: #e0826b; --model: #98bd66; --evidence: #b58ee0; --screen: #5cc0c0; --sting: #c4b280;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151513; --panel: #1f1e1b; --ink: #eceae3; --muted: #9c988d; --line: #33312c; --hover: #2a2925;
  --active: #3a321c; --active-line: #e0b440; --word: #e0b440;
  --locked: #56b07c; --flagged: #e5675a; --unreviewed: #8a867c;
  --film: #6f9ae0; --presenter: #e0826b; --model: #98bd66; --evidence: #b58ee0; --screen: #5cc0c0; --sting: #c4b280;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
header h1 { font-size: 17px; margin: 0; font-weight: 650; }
header .meta { color: var(--muted); font-size: 12.5px; }
.counts { display: flex; gap: 12px; font-size: 12.5px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0; }
.left { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; padding: 14px 16px 24px; border-right: 1px solid var(--line); }
.right { padding: 8px 16px 40px; min-width: 0; }
video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; display: block; }
.novideo { display: none; aspect-ratio: 16 / 9; border-radius: 6px; background: var(--panel); border: 1px dashed var(--line); padding: 20px; color: var(--muted); font-size: 13px; }
.novideo code { color: var(--ink); word-break: break-all; }
body.no-video video { display: none; }
body.no-video .novideo { display: block; }
.strip { position: relative; display: flex; height: 26px; margin: 10px 0 4px; border-radius: 4px; overflow: hidden; cursor: pointer; background: var(--line); }
.strip .blk { position: relative; height: 100%; border-right: 1px solid var(--bg); opacity: .8; }
.strip .blk.locked::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--locked); }
.strip .blk.flagged::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--flagged); box-shadow: 0 0 0 1.5px var(--bg); }
.strip .blk.dim { opacity: .25; }
.strip .blk.cur { opacity: 1; outline: 2px solid var(--ink); outline-offset: -2px; z-index: 1; }
.strip .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); pointer-events: none; z-index: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip.toggle[aria-pressed="true"] { border-color: var(--ink); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
.card h2 { font-size: 15px; margin: 0 0 6px; }
.card h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 3px; font-weight: 600; }
.card p { margin: 0; }
.card .avoid { border-left: 3px solid var(--flagged); padding-left: 8px; }
.words { font-size: 15px; line-height: 1.6; }
.words span.on { background: var(--word); color: #1d1c1a; border-radius: 3px; }
.words span.past { color: var(--muted); }
.src { font-size: 12px; color: var(--muted); word-break: break-all; }
.keys { font-size: 12px; color: var(--muted); margin-top: 10px; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; font: 11px ui-monospace, monospace; }
.scene { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 12px 0 6px; border-bottom: 1px solid var(--line); margin-top: 6px; }
.scene b { font-size: 13.5px; }
.scene div { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.row { display: grid; grid-template-columns: 144px minmax(0, 1fr); gap: 12px; padding: 9px 8px; border-radius: 6px; cursor: pointer; border-left: 3px solid transparent; }
.row:hover { background: var(--hover); }
.row.cur { background: var(--active); border-left-color: var(--active-line); }
.row.hidden, .scene.hidden { display: none; }
.thumb { width: 144px; aspect-ratio: 16 / 9; border-radius: 4px; background: var(--line); display: block; position: relative; overflow: hidden; }
.thumb canvas { width: 100%; height: 100%; display: block; }
.thumb .lane { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 12px; color: var(--muted); }
.top .id { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.state { font-size: 11.5px; font-weight: 600; }
.state.locked { color: var(--locked); } .state.flagged { color: var(--flagged); } .state.unreviewed { color: var(--unreviewed); }
.form { margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.said { margin-top: 3px; color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
footer { padding: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
footer code { word-break: break-all; color: var(--ink); }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .left { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .player { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-bottom: 4px; }
  .row { grid-template-columns: 104px minmax(0, 1fr); gap: 10px; }
  .thumb { width: 104px; }
  .keys { display: none; }
}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="meta" id="meta"></span>
  <span class="counts" id="counts"></span>
</header>
<div class="layout">
  <section class="left">
    <div class="player">
      <video id="video" controls preload="metadata" playsinline></video>
      <div class="novideo" id="novideo"></div>
      <div class="strip" id="strip" title="Click to jump"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="controls" id="filters"></div>
    <div class="card" id="now"></div>
    <div class="keys"><kbd>Space</kbd> play or pause · <kbd>J</kbd>/<kbd>K</kbd> next or previous segment · <kbd>L</kbd> loop this segment · <kbd>F</kbd> list follows playback</div>
  </section>
  <section class="right" id="list"></section>
</div>
<footer id="footer"></footer>
<video id="thumbsrc" muted preload="auto" playsinline style="display:none"></video>
<script id="board" type="application/json">__BOARD_JSON__</script>
<script>
'use strict';
const B = JSON.parse(document.getElementById('board').textContent);
const $ = (id) => document.getElementById(id);
const video = $('video');
const LANES = { film: 'Film', presenter: 'Presenter', model: 'Model', evidence: 'Evidence', screen: 'Screen', sting: 'Sting' };
const STATES = { locked: 'Owner lock applies', flagged: 'Flagged', unreviewed: 'Not owner reviewed' };
const total = B.total_frames / B.fps;
const rows = B.rows;
let cur = -1, loop = false, follow = true;
const shown = { lane: {}, state: {} };

const fmt = (s) => { const m = Math.floor(s / 60); return m + ':' + (s - m * 60).toFixed(1).padStart(4, '0'); };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const laneColor = (lane) => `var(--${LANES[lane] ? lane : 'sting'})`;

$('title').textContent = B.title;
document.title = B.title;
$('meta').textContent = `${B.build_version || 'build'} · ${rows.length} segments · ${fmt(total)} · ${B.owner_accepted ? 'owner accepted' : 'not owner accepted'}`;
const count = (k) => rows.filter((r) => r.state === k).length;
$('counts').innerHTML = Object.entries(STATES).map(([k, v]) => `<span><span class="dot" style="background:var(--${k})"></span>${count(k)} ${esc(v.toLowerCase())}</span>`).join('');
$('legend').innerHTML = Object.entries(LANES).filter(([k]) => rows.some((r) => r.lane === k)).map(([k, v]) => `<span><span class="dot" style="background:${laneColor(k)}"></span>${v}</span>`).join('')
  + `<span><span class="dot" style="background:var(--locked);border-radius:1px;height:4px"></span>owner lock</span><span><span class="dot" style="background:var(--flagged)"></span>flagged</span>`;

// Filters
const filters = $('filters');
function chip(group, key, label) {
  shown[group][key] = true;
  const b = document.createElement('button');
  b.className = 'chip'; b.setAttribute('aria-pressed', 'true'); b.textContent = label;
  b.onclick = () => { shown[group][key] = !shown[group][key]; b.setAttribute('aria-pressed', shown[group][key]); applyFilters(); };
  filters.appendChild(b);
}
Object.entries(LANES).filter(([k]) => rows.some((r) => r.lane === k)).forEach(([k, v]) => chip('lane', k, v));
Object.entries(STATES).filter(([k]) => count(k)).forEach(([k, v]) => chip('state', k, v));

// Timeline strip
const strip = $('strip');
rows.forEach((r, i) => {
  const d = document.createElement('div');
  d.className = 'blk ' + r.state;
  d.style.flex = String(r.frames[1] - r.frames[0]);
  d.style.background = laneColor(r.lane);
  d.title = `${r.id} · ${LANES[r.lane] || r.lane} · ${fmt(r.start)}`;
  strip.appendChild(d);
});
const head = document.createElement('div'); head.className = 'head'; strip.appendChild(head);
strip.addEventListener('click', (e) => { const rect = strip.getBoundingClientRect(); seek(((e.clientX - rect.left) / rect.width) * total); });

// Segment list
const list = $('list');
const rowEls = [], sceneEls = {};
let lastScene = null;
rows.forEach((r, i) => {
  if (r.scene !== lastScene) {
    lastScene = r.scene;
    const s = B.scenes[r.scene] || {};
    const h = document.createElement('div');
    h.className = 'scene';
    h.innerHTML = `<b>${esc(r.scene)} ${esc(s.title || '')}</b>${s.job ? `<div>${esc(s.job)}</div>` : ''}`;
    list.appendChild(h); sceneEls[r.scene] = h;
  }
  const el = document.createElement('div');
  el.className = 'row';
  el.innerHTML = `<div class="thumb"><canvas width="256" height="144"></canvas><span class="lane" style="background:${laneColor(r.lane)}"></span></div>
    <div><div class="top"><span class="id">${fmt(r.start)}</span><span>${esc(r.id)}${r.take ? ' · ' + esc(r.take) : ''} · ${esc(LANES[r.lane] || r.lane)}</span><span class="state ${r.state}">${esc(STATES[r.state])}</span></div>
    <div class="form">${esc(r.form)}</div><div class="said">“${esc(r.words.map((w) => w[0]).join(' '))}”</div></div>`;
  el.onclick = () => { seek(r.start + 0.001); video.play().catch(() => {}); };
  list.appendChild(el); rowEls.push(el);
  const ctx = el.querySelector('canvas').getContext('2d');
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--line'); ctx.fillRect(0, 0, 256, 144);
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--muted'); ctx.font = '600 22px sans-serif'; ctx.fillText(r.id, 16, 80);
});

function applyFilters() {
  const visibleScenes = new Set();
  rows.forEach((r, i) => {
    const ok = shown.lane[r.lane] !== false && shown.state[r.state] !== false;
    rowEls[i].classList.toggle('hidden', !ok);
    strip.children[i].classList.toggle('dim', !ok);
    if (ok) visibleScenes.add(r.scene);
  });
  Object.entries(sceneEls).forEach(([k, el]) => el.classList.toggle('hidden', !visibleScenes.has(k)));
}

// Now-playing card
function renderNow(i) {
  const r = rows[i]; const s = B.scenes[r.scene] || {};
  const block = (label, text, cls = '') => text ? `<h3>${label}</h3><p class="${cls}">${esc(text)}</p>` : '';
  $('now').innerHTML = `<h2>${esc(r.scene)} ${esc(s.title || '')}</h2>`
    + block('Scene job', s.job)
    + (s.before ? `<h3>Viewer before → after</h3><p>${esc(s.before)} → ${esc(s.after)}</p>` : '')
    + block('Must not imply', s.must_not_imply, 'avoid')
    + `<h3>${esc(r.id)}${r.take ? ' · ' + esc(r.take) : ''} · ${esc(LANES[r.lane] || r.lane)} · ${fmt(r.start)}–${fmt(r.end)}</h3><p>${esc(r.form)}</p>`
    + `<h3>Said</h3><p class="words" id="words">${r.words.map((w, k) => `<span data-k="${k}">${esc(w[0])}</span>`).join(' ')}</p>`
    + `<h3>Status</h3><p><span class="state ${r.state}">${esc(STATES[r.state])}</span>${r.note ? ' · ' + esc(r.note) : ''}</p>`
    + `<h3>Source</h3>${r.sources.map((x) => `<p class="src">${esc(x.path)}<br>${esc(x.sha256.slice(0, 16))}…</p>`).join('') || '<p class="src">none recorded</p>'}`;
}

function indexAt(t) {
  let lo = 0, hi = rows.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (rows[mid].start <= t) lo = mid; else hi = mid - 1; }
  return lo;
}
function setCurrent(i, scroll) {
  if (i === cur) return;
  if (cur >= 0) { rowEls[cur].classList.remove('cur'); strip.children[cur].classList.remove('cur'); }
  cur = i; rowEls[i].classList.add('cur'); strip.children[i].classList.add('cur');
  renderNow(i);
  if (scroll && follow) rowEls[i].scrollIntoView({ block: 'center', behavior: 'smooth' });
}
let fakeTime = 0;
const now = () => document.body.classList.contains('no-video') ? fakeTime : video.currentTime;
function seek(t) {
  t = Math.max(0, Math.min(total - 0.001, t));
  if (document.body.classList.contains('no-video')) { fakeTime = t; tick(true); } else video.currentTime = t;
}
function tick(scroll) {
  const t = now();
  const i = indexAt(t);
  if (loop && cur >= 0 && i !== cur && !video.paused) { video.currentTime = rows[cur].start; return; }
  setCurrent(i, scroll);
  head.style.left = (t / total * 100) + '%';
  const w = document.getElementById('words');
  if (w) w.querySelectorAll('span').forEach((s) => {
    const x = rows[cur].words[+s.dataset.k];
    s.className = t >= x[1] && t < x[2] ? 'on' : (t >= x[2] ? 'past' : '');
  });
}
video.addEventListener('timeupdate', () => tick(true));
video.addEventListener('seeked', () => tick(true));
(function frame() { if (!video.paused) tick(false); requestAnimationFrame(frame); })();

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); video.paused ? video.play().catch(() => {}) : video.pause(); }
  else if (k === 'j' || k === 'arrowdown') { e.preventDefault(); seek(rows[Math.min(rows.length - 1, cur + 1)].start + 0.001); }
  else if (k === 'k' || k === 'arrowup') { e.preventDefault(); seek(rows[Math.max(0, cur - 1)].start + 0.001); }
  else if (k === 'l') { loop = !loop; }
  else if (k === 'f') { follow = !follow; }
});

// Thumbnails come from the same video, one seek at a time, only for rows on screen.
const thumbs = $('thumbsrc'); const queue = []; let busy = false, thumbsOk = false;
function pump() {
  if (busy || !thumbsOk || !queue.length) return;
  busy = true; const i = queue.shift(); const r = rows[i];
  const done = () => {
    thumbs.removeEventListener('seeked', done);
    try { rowEls[i].querySelector('canvas').getContext('2d').drawImage(thumbs, 0, 0, 256, 144); } catch (_) {}
    busy = false; pump();
  };
  thumbs.addEventListener('seeked', done);
  thumbs.currentTime = Math.min(r.end - 0.05, r.start + Math.min(1.5, (r.end - r.start) / 2));
}
const io = new IntersectionObserver((entries) => entries.forEach((en) => {
  if (!en.isIntersecting) return;
  const i = rowEls.indexOf(en.target); io.unobserve(en.target); queue.push(i); pump();
}), { rootMargin: '400px' });
thumbs.addEventListener('loadeddata', () => { thumbsOk = true; pump(); });

video.addEventListener('error', () => {
  document.body.classList.add('no-video');
  $('novideo').innerHTML = `<b>No video at this path.</b><br>The board still reads as a plan: click any segment.<br><br>Expected: <code>${esc(B.video_src)}</code><br>sha256 <code>${esc(B.inputs.video.sha256)}</code><br><br>Open this page on the machine that has the build, or serve its folder.`;
  tick(false);
});
if (B.video_src) { video.src = B.video_src; thumbs.src = B.video_src; } else video.dispatchEvent(new Event('error'));
rowEls.forEach((el) => io.observe(el));

$('footer').innerHTML = `<b>Board digest</b> <code>${esc(B.digest)}</code><br>This digest covers the build, plan, transcript, direction, video hash, owner locks and every segment's source hashes. Any change produces a new digest.`
  + (B.limits.length ? `<br><br><b>Build limits</b><br>${B.limits.map(esc).join('<br>')}` : '')
  + `<br><br><b>Owner locks shown</b><br>${B.locks.map((l) => `${esc(l.scope)} <code>${esc(l.path)}</code>`).join('<br>') || 'none'}`;
applyFilters();
setCurrent(0, false);
</script>
</body>
</html>
