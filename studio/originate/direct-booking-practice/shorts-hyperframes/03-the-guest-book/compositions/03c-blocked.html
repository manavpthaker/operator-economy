<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 03c, the route that stops. f458-576, 4.917s. silent_graphic.
         Per the accepted r50 precedent: when evidence exists but cannot be reached, show
         INTERRUPTED ACCESS rather than a locked, crossed-out or blank record, which would
         claim absence, falsity or concealment. -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "BL Supreme"; src: url("assets/fonts/supreme-500.woff2") format("woff2");
          font-weight: 500; font-display: block; }
        #root { position: absolute; inset: 0; background: #f5f0e6; overflow: hidden; }
        /* SHARED GEOMETRY v2. Portrait safe area: bottom 300px, right 180px stay clear. */
        .head { position: absolute; left: 80px; top: 200px; width: 800px; }
        .kick { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 26px;
          letter-spacing: 0.24em; text-transform: uppercase; color: #566461; }
        .body { position: absolute; left: 80px; top: 300px; width: 800px; }
        .foot { position: absolute; left: 80px; top: 1210px; width: 800px;
          font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 42px;
          line-height: 1.3; color: #19201f; }
        .record { background: #204440; padding: 38px 40px 40px; }
        .record-k { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 24px;
          letter-spacing: 0.24em; text-transform: uppercase; color: rgba(245,240,230,0.56); }
        .record-v { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 44px;
          line-height: 1.3; color: #f5f0e6; margin-top: 16px; }
        .record-src { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 23px;
          letter-spacing: 0.1em; color: rgba(245,240,230,0.72); margin-top: 22px; padding-top: 18px;
          border-top: 1px solid rgba(245,240,230,0.22); }
        .field { display: grid; grid-template-columns: 300px 1fr; align-items: baseline;
          border-bottom: 1px solid #d8cfb9; padding: 34px 0 30px; }
        .fk { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 25px;
          letter-spacing: 0.18em; text-transform: uppercase; color: #566461; }
        .fv { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 40px;
          color: #19201f; word-break: break-word; }
        .fv.alias { color: #33464c; }
        .fv.absent { color: #566461; }
        .fv.mine { color: #87341f; }
        .route { position: absolute; left: 80px; top: 420px; width: 800px; height: 300px; }
        .route svg { width: 100%; height: 100%; overflow: visible; }
        .route [data-steel] { fill: none; stroke: #586d74; stroke-width: 4; stroke-linecap: round; }
        .route [data-node] { fill: #f5f0e6; stroke: #586d74; stroke-width: 4; }
        .route [data-mark] { fill: #566461; }
        .rcap { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 25px;
          letter-spacing: 0.18em; text-transform: uppercase; fill: #566461; }
      </style>
      <div id="root" data-composition-id="f03c-blocked" data-width="1080" data-height="1920">
        <div class="head"><div class="kick">so the obvious move is closed</div></div>
        <div class="route">
          <svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
            <text class="rcap" x="0" y="30">the inn</text>
            <rect data-node x="0" y="56" width="150" height="74" rx="6" />
            <path data-steel id="f03c-leg" d="M 150 93 L 520 93" />
            <text class="rcap" x="556" y="30">the guest</text>
            <circle data-mark cx="610" cy="93" r="14" />
          </svg>
        </div>
        <div class="foot" id="f03c-foot" style="opacity:0">You cannot win a guest back from a relay address, and you are not supposed to try.</div>
      </div>
      <script>
        (() => { const tl = gsap.timeline({ paused: true });
          // The route is drawn and simply stops short of the guest. Nothing is crossed out,
          // locked or blanked: access is interrupted, which is all the source supports.
          const p = document.querySelector("#f03c-leg");
          const len = p.getTotalLength();
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
          tl.to("#f03c-leg", { strokeDashoffset: len * 0.42, duration: 1.1, ease: "power2.out" }, 0.3);
          tl.to("#f03c-foot", { opacity: 1, duration: 0.45, ease: "power2.out" }, 1.9);
          window.__timelines["f03c-blocked"] = tl; })();
      </script>
    </template>
  </body>
</html>
