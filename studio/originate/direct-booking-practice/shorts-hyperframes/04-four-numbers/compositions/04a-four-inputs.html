<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 04a, the four inputs. f147-306, 6.625s. silent_graphic.
         Role: humanContext, establish then settle. Four slots and no values: the viewer's
         job is to go and get them, and no claim supports a figure for any property. -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "BL Supreme"; src: url("assets/fonts/supreme-500.woff2") format("woff2");
          font-weight: 500; font-display: block; }
        #root { position: absolute; inset: 0; background: #f5f0e6; overflow: hidden; }
        /* SHARED GEOMETRY v2. Portrait safe area: bottom 300px, right 180px stay clear. */
        .head { position: absolute; left: 80px; top: 200px; width: 800px; }
        .kick { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 26px;
          letter-spacing: 0.24em; text-transform: uppercase; color: #566461; }
        .body { position: absolute; left: 80px; top: 300px; width: 800px; }
        .foot { position: absolute; left: 80px; top: 1230px; width: 800px;
          font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 40px;
          line-height: 1.3; color: #19201f; }
        /* A ledger of method, not of figures. No value is ever filled in: no claim
           supports a rate for any property, and the instruction is to go and find out. */
        .line { display: grid; grid-template-columns: 1fr 210px; align-items: baseline;
          border-bottom: 1px solid #d8cfb9; padding: 30px 0 26px; }
        .lk { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 40px;
          color: #19201f; }
        .lv { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 30px;
          letter-spacing: 0.16em; text-transform: uppercase; text-align: right; color: #566461; }
        .line.derived { border-bottom-color: #c4b99e; }
        .line.derived .lk { color: #33464c; }
        .line.ceiling { border-bottom: 3px solid #b5482f; border-top: 3px solid #b5482f;
          margin-top: 22px; padding: 34px 0 30px; }
        .line.ceiling .lk { color: #87341f; }
        .line.ceiling .lv { color: #87341f; }
        .hyp { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 24px;
          letter-spacing: 0.18em; text-transform: uppercase; color: #90394a; margin-top: 12px; }
        .op { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 26px;
          letter-spacing: 0.2em; text-transform: uppercase; color: #566461; margin: 20px 0 4px; }

      </style>
      <div id="root" data-composition-id="f04a-four-inputs" data-width="1080" data-height="1920">
        <div class="head"><div class="kick">four numbers you ask for</div></div>
        <div class="body">
          <div class="line " id="L1"><div class="lk">Rooms</div><div class="lv">ask the owner</div></div>
          <div class="line " id="L2"><div class="lk">Average nightly rate</div><div class="lv">ask the owner</div></div>
          <div class="line " id="L3"><div class="lk">Occupancy</div><div class="lv">ask the owner</div></div>
          <div class="line " id="L4"><div class="lk">Share arriving through the sites</div><div class="lv">ask the owner</div></div>
        </div>
      </div>
      <script>
        (() => { const tl = gsap.timeline({ paused: true });
          // establish: one input at a time, on its own word. Nothing is computed yet.
          tl.from("#L1", { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, 0.1);
          tl.from("#L2", { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, 1.0);
          tl.from("#L3", { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, 2.5);
          tl.from("#L4", { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, 3.75);
          window.__timelines["f04a-four-inputs"] = tl; })();
      </script>
    </template>
  </body>
</html>
