<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 02b, the list belongs to nobody. f396-546, 6.25s. silent_graphic.
         The owner column empties: the direct path is not a system, it is a list of small
         jobs with no owner. U-01: one change at a time. -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "BL Supreme"; src: url("assets/fonts/supreme-500.woff2") format("woff2");
          font-weight: 500; font-display: block; }
        #root { position: absolute; inset: 0; background: #f5f0e6; overflow: hidden; }
        /* SHARED GEOMETRY v2. Portrait safe area: bottom 300px, right 180px stay clear. */
        .head { position: absolute; left: 80px; top: 200px; width: 800px; }
        .kick { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 26px;
          letter-spacing: 0.24em; text-transform: uppercase; color: #566461; }
        .ledger { position: absolute; left: 80px; top: 300px; width: 800px; }
        .row { display: grid; grid-template-columns: 1fr 250px; align-items: center;
          border-bottom: 1px solid #d8cfb9; padding: 42px 0 38px; }
        .job { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 44px;
          line-height: 1.2; color: #19201f; }
        .who { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 25px;
          letter-spacing: 0.16em; text-transform: uppercase; text-align: right; }
        .who.empty { color: #303b39; }
        .who.tool { color: #586d74; }
        .who.yours { color: #87341f; }
        .colhead { display: grid; grid-template-columns: 1fr 250px; padding-bottom: 14px;
          border-bottom: 2px solid #c4b99e; }
        .colhead div { font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 24px;
          letter-spacing: 0.2em; text-transform: uppercase; color: #566461; }
        .colhead .r { text-align: right; }
        .foot { position: absolute; left: 80px; top: 1210px; width: 800px;
          font-family: "BL Supreme", system-ui, sans-serif; font-weight: 500; font-size: 40px;
          line-height: 1.3; color: #19201f; }

      </style>
      <div id="root" data-composition-id="f02b-the-list" data-width="1080" data-height="1920">
        <div class="head"><div class="kick">the direct path is not a system</div></div>
        <div class="ledger">
          <div class="colhead"><div>the job</div><div class="r">who does it</div></div>
          <div class="row" id="row-f1">
            <div class="job">Write the thank you</div>
            <div class="who empty" id="who-f1">the front desk</div>
          </div>
          <div class="row" id="row-f2">
            <div class="job">Check the direct rate</div>
            <div class="who empty" id="who-f2">the front desk</div>
          </div>
          <div class="row" id="row-f3">
            <div class="job">Keep the free listing live</div>
            <div class="who empty" id="who-f3">the front desk</div>
          </div>
          <div class="row" id="row-f4">
            <div class="job">Read the reservation report</div>
            <div class="who empty" id="who-f4">the front desk</div>
          </div>
          <div class="row" id="row-f5">
            <div class="job">Decide who gets a message</div>
            <div class="who empty" id="who-f5">the front desk</div>
          </div>
          <div class="row" id="row-f6">
            <div class="job">Tell the owner what moved</div>
            <div class="who empty" id="who-f6">the front desk</div>
          </div>
        </div>
        <div class="foot" id="f02b-foot" style="opacity:0">A list of small jobs, and the list belongs to nobody.</div>
      </div>
      <script>
        (() => { const tl = gsap.timeline({ paused: true });
          // The one answer that was there is withdrawn, row by row. Nothing else moves.
          tl.to("#who-f1", { opacity: 0, duration: 0.3, ease: "power1.in" }, 0.5);
          tl.to("#who-f2", { opacity: 0, duration: 0.3, ease: "power1.in" }, 0.78);
          tl.to("#who-f3", { opacity: 0, duration: 0.3, ease: "power1.in" }, 1.06);
          tl.to("#who-f4", { opacity: 0, duration: 0.3, ease: "power1.in" }, 1.34);
          tl.to("#who-f5", { opacity: 0, duration: 0.3, ease: "power1.in" }, 1.62);
          tl.to("#who-f6", { opacity: 0, duration: 0.3, ease: "power1.in" }, 1.9);
          tl.to("#f02b-foot", { opacity: 1, duration: 0.45, ease: "power2.out" }, 3.6);
          window.__timelines["f02b-the-list"] = tl; })();
      </script>
    </template>
  </body>
</html>
